# gnome-setup's pages for Utah live media (installed over gnome-setup's own
# /usr/lib/gnome-setup/pages.conf by iso/raw/Containerfile). gnome-setup runs
# the live-initial-setup mode. The user is created on first boot by
# gnome-initial-setup, so the flow ends at the done page: no privacy,
# network, timezone or user pages. prerelease-warning shows only for an
# os-release RELEASE_TYPE other than stable; eula only with
# /usr/share/gnome-setup/eula.xml, which Utah does not ship. The root is
# encrypted (LUKS2) by default: the disk page's "Encrypt Disk" switch, on
# unless the user turns it off, decides. Encrypted, disk-passphrase shows only
# on a machine without a TPM 2.0 (the root is then not TPM-bound, so the user
# picks a passphrase, kept next to the recovery key) and recovery-key always;
# unencrypted, neither does.
[modes]
live-initial-setup=language;keyboard;prerelease-warning;eula;try-or-install;installer;disk-passphrase;recovery-key;installer-done

[page:installer]
# Utah's fixups after systemd-sysinstall's block copy, with the target disk
# as the instance (/usr/libexec/utah-sysinstall-post).
post-install-unit=utah-sysinstall-post@.service
# With the "Encrypt Disk" switch off, gnome-setup installs with these
# definitions instead of /usr/lib/gnome-setup/definitions: the same
# partitions, the root without Encrypt= (utah-live-definitions writes both).
unencrypted-definitions=/run/utah-live/repart-unencrypted.d
