# Live media (utah.live) are not a bootc host: the service's `bootc status`
# remounts /sysroot read-write before it reports, and the live /sysroot is the
# read-only RAM overlay (utah-live-root.service), which overlayfs refuses to
# reconfigure ("overlay: No changes allowed in reconfigure"). The unit could
# only fail there. Its one output, /run/ublue-os/booted-image, is optional:
# ublue-booted-image (fastfetch) falls back to image-info.json, and
# projectbluefin-countme reads the deployment's .origin first.
[Unit]
ConditionKernelCommandLine=!utah.live
