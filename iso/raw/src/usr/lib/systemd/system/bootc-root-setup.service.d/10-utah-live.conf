# Pull in the utah.live root overlay and run after it (utah-live-root.service):
# on a composefs-backend medium, bootc's initramfs-setup then assembles the
# composefs root from the overlaid /sysroot. Without utah.live on the kernel
# command line that unit is skipped and this ordering is inert.
[Unit]
Wants=utah-live-root.service
After=utah-live-root.service
