# Live media (utah.live) must not download Flatpaks: the live session writes
# to a RAM overlay, so a medium without baked Flatpaks would pull the whole
# preinstall set into memory, only to lose it at shutdown (Dakota's live spike
# filled a 4 GB zram this way within a minute). The installed system runs it
# on first boot; a Flatpak medium already carries the set.
[Unit]
ConditionKernelCommandLine=!utah.live
