# The hybrid ISO booted as a CD-ROM (build-hybrid-iso.sh). Its GPT is written
# for 512-byte sectors and an optical drive has 2048-byte ones, so the kernel
# finds no partitions on it. udev's blkid builtin (systemd 261) then sets
# ID_PART_GPT_AUTO_ROOT_DISK_NEEDS_LOOP on the drive when the GPT holds the
# ESP systemd-boot booted from (LoaderDevicePartUUID), and 99-systemd.rules
# pulls in systemd-loop@<drive>.service: systemd-dissect attaches a loop
# device with the GPT's sector size and partition scanning, and root=UUID=
# finds the medium's root on it. That happens in the initrd (60-utah-live.conf
# puts this unit there). Once the live system runs, udev replays the drive's
# event; a second loop device would carry the same filesystems and partition
# UUIDs again, and the installer's sources (utah-live-definitions, by
# PARTUUID) could resolve to either. So the live system never attaches one.
[Unit]
ConditionPathExists=|/etc/initrd-release
ConditionKernelCommandLine=|!utah.live
