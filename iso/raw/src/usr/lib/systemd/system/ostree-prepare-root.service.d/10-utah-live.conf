# utah.live boots the installed disk image with systemd.volatile=overlay:
# systemd-volatile-root turns the physical /sysroot into an overlay with a
# tmpfs upper layer. ostree-prepare-root must find that overlay, not the bare
# medium, so every write of the live session (deployment /etc and /var
# included) lands in RAM. Without the karg volatile-root is not pulled in and
# this ordering is inert.
[Unit]
After=systemd-volatile-root.service
