# Live media (utah.live) must not update the bootloader, stage images, or
# mount and write the medium's /boot: the medium is the install source.
# A composefs-backend medium has no /boot in fstab (bootc passes it as a
# systemd.mount-extra karg), so systemd-gpt-auto-generator adds this
# automount. With boot.mount skipped it would answer every access to /boot
# with ENODEV, and every unit that sets up a mount namespace (dbus-broker
# first, so no D-Bus and no GDM) fails to start (run 44910214722).
[Unit]
ConditionKernelCommandLine=!utah.live
