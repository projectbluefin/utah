# Live boot of the installed disk image (utah.live): the initrd overlay unit,
# the systemd-volatile-root binary it runs, and the ostree-prepare-root
# drop-in that pulls it in. See utah-live-root.service.
install_items+=" /usr/lib/systemd/systemd-volatile-root /usr/lib/systemd/system/utah-live-root.service /usr/lib/systemd/system/ostree-prepare-root.service.d/10-utah-live.conf "
add_drivers+=" overlay "
