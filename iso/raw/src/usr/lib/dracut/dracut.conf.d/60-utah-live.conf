# Live boot of the installed disk image (utah.live): the initrd overlay unit,
# the systemd-volatile-root binary it runs, and the drop-ins that pull it in
# before the ostree and the composefs root setup. See utah-live-root.service.
install_items+=" /usr/lib/systemd/systemd-volatile-root /usr/lib/systemd/system/utah-live-root.service /usr/lib/systemd/system/ostree-prepare-root.service.d/10-utah-live.conf /usr/lib/systemd/system/bootc-root-setup.service.d/10-utah-live.conf "
add_drivers+=" overlay "
# The hybrid ISO booted as a CD-ROM (build-hybrid-iso.sh): systemd's udev
# rules pull in systemd-loop@<drive>.service, which runs systemd-dissect to
# attach a partitioned loop device over the drive, so root=UUID= finds the
# medium's root on it. See systemd-loop@.service.d/50-utah-live.conf.
install_items+=" /usr/bin/systemd-dissect /usr/lib/systemd/system/systemd-loop@.service /usr/lib/systemd/system/systemd-loop@.service.d/50-utah-live.conf "
add_drivers+=" loop "
