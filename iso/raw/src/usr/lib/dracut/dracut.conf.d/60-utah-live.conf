# Live boot of the installed disk image (utah.live systemd.volatile=overlay).
# systemd-fstab-generator pulls systemd-volatile-root.service into the initrd
# when systemd.volatile= is set, but dracut does not carry it by default.
install_items+=" /usr/lib/systemd/systemd-volatile-root /usr/lib/systemd/system/systemd-volatile-root.service /usr/lib/systemd/system/ostree-prepare-root.service.d/10-utah-live.conf "
add_drivers+=" overlay "
