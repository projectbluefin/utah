# zswap.compressor=zstd (/usr/lib/bootc/kargs.d/20-zswap.toml) is read when
# zswap initialises, during kernel init and before the root filesystem is
# mounted. Hummingbird's kernel builds the zstd crypto driver as a module
# (CONFIG_CRYPTO_ZSTD=m), so the kernel can only load it from the initramfs;
# without it zswap logs "compressor zstd not available" and falls back to
# lzo. Kernels with zstd built in or absent skip this harmlessly.
add_drivers+=" zstd "
