# GNOME OS's fallback NTP server, as Dakota ships it (#1228). gnome-build-meta
# compiles it into systemd-timesyncd: core-deps/systemd-base.bst sets
# fallback-ntp-servers: "gnome.pool.ntp.org" and passes -Dntp-servers=. The
# Hummingbird build compiles in *.hummingbird.pool.ntp.org, which does not
# resolve on the public internet (#594), and NetworkManager does not hand
# DHCP-provided NTP servers to timesyncd, so this is the server a laptop uses.
[Time]
FallbackNTP=gnome.pool.ntp.org
