# Let avahi-daemon enter its SELinux domain (#443).
#
# Hummingbird's avahi (0.9~rc4) ships NoNewPrivileges=yes. Under NNP a domain
# transition needs an explicit nnp_transition permission, and the targeted
# policy (selinux-policy 45.20) grants none from init_t to avahi_t, so:
#
#   avc: denied { nnp_transition } scontext=init_t tcontext=avahi_t
#   avc: denied { create } comm="avahi-daemon" ... tcontext=avahi_var_run_t
#
# The daemon stays in init_t, cannot write its pid file, exits 255, and the
# socket gives up at the start limit: no mDNS, so `ssh host.local` fails with
# "Temporary failure in name resolution". Fedora's unit does not set NNP.
# avahi_t remains SELinux-confined; only the NNP flag is dropped. Remove this
# once the policy grants the transition (init_nnp_daemon_domain(avahi_t)).
[Service]
NoNewPrivileges=no
