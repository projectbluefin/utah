# Tolerate harness-driven start bursts on the daily ping service.
#
# The upstream testsuite's printing scenarios unmask CUPS units in a loop,
# and post-testing-e2e runs showed projectbluefin-countme.service started 5
# times in ~3s during that sequence, tripping systemd's default start limit
# (5 starts per 10s) and leaving a permanently failed unit that fails the
# `No failed systemd units at boot` health check (#741). Each start exits 0,
# so this is limiter accounting on a bursty starter, not a crash loop; a
# genuinely failing service still fails, just after a wider window. The exact
# starter was not identified from the serial logs.
[Unit]
StartLimitBurst=20
StartLimitIntervalSec=120
