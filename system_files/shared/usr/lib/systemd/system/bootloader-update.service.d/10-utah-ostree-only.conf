# bootupd's unit skips live media only when /sysroot is erofs or squashfs
# (its ExecCondition). Utah's live ISO boots a dmsquash-live overlay root with
# no /sysroot at all, so the check passed, `bootupctl update` ran against a
# system it does not manage, and every live session showed
# "[FAILED] Failed to start bootloader-update.service" on the console and in
# `systemctl --failed`. bootupd only manages ostree-booted systems; say so.
[Unit]
ConditionPathExists=/run/ostree-booted
