# Only update the ESP boot manager on boots that came through it (#363).
#
# bootupd stands down on systemd-boot systems by design ("managed with
# bootctl"), so this service is the only thing keeping those binaries current.
# But it must not run on GRUB or BIOS systems, whose ESP may not be
# systemd-boot's at all and whose grub and shim bootupd already manages.
#
# LoaderInfo is a coarse gate: systemd-boot sets it, but so does GRUB's bli
# module, which Fedora's grub2 embeds, so the condition is also true on a
# Fedora GRUB-EFI boot. That is harmless -- bootctl update is a no-op there,
# because it only replaces a product it recognises as its own and refuses a
# foreign one -- but it does mean the unit is started, not skipped, on those
# systems. BIOS systems have no efivars and are skipped outright.
#
# ConditionSecurity keeps us off Secure Boot systems entirely. Utah ships
# systemd-boot-unsigned; on a switcher whose ESP carries a DB-signed sd-boot
# (Bluefin Server signs its own), bootctl's version check looks at product and
# version only, so an unsigned build of the same or newer version would
# overwrite the signed binary and the firmware would reject the next boot.
[Unit]
ConditionPathExists=/sys/firmware/efi/efivars/LoaderInfo-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f
ConditionSecurity=!uefi-secureboot
