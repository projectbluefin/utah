# Install the first-boot Flatpaks in the background.
#
# common's unit is a oneshot wanted by multi-user.target. A target orders itself
# After= every unit it Wants unless that unit sets DefaultDependencies=no, so
# multi-user.target and graphical.target waited for the Flathub download:
# graphical.target at 1min 10s on a fresh install, 60s of it this unit. The
# explicit ordering below is what default dependencies gave it, minus the
# target. GDM never waited, but everything ordered after graphical.target did.
[Unit]
DefaultDependencies=no
Requires=sysinit.target
After=sysinit.target basic.target
Conflicts=shutdown.target
Before=shutdown.target

[Service]
Nice=10
IOSchedulingClass=idle
