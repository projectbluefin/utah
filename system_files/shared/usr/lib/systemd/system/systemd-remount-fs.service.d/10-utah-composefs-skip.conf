# / on an installed Utah system is a read-only composefs overlay (#585).
#
# systemd-remount-fs.service unconditionally tries to remount / read-write so
# systemd-tmpfiles and friends can stamp the filesystem. The upstream unit
# carries no Condition*= gates at all, so on the composefs image the remount
# fails with
#
#   mount: /: fsconfig() failed: overlay: No changes allowed in reconfigure.
#
# and the unit exits 1. With nothing else wrong, that single failure leaves
# SystemState=degraded on every boot. StatusErrno=0 on the failed unit, so
# errno-keyed triage misses it; only UnitActiveState=failed + the journal
# show it.
#
# `ConditionPathIsReadWrite=` checks ST_RDONLY in statvfs(2). composefs
# mounts / read-only (`findmnt /` shows `composefs overlay ro,...`), so the
# condition fails and the unit is skipped -- never failed, never degraded.
# The live ISO (overlay root in `iso/scripts/build-iso.sh`) is mounted
# writable, so the condition succeeds and the remount still runs there.
# A blanket mask would kill both paths; a condition keyed on the mount
# state keeps the writable ISO alive. The live ISO does not exercise the
# read-only install path -- that is what the composefs VM check below
# confirms on a real boot.
#
# Limitation: this condition is true only when / is writable, so it is
# false -- and the unit is skipped -- on any non-composefs boot that comes
# up `ro` (e.g. `ro` / `rootflags=ro` kargs, an fsck fallback, an ostree
# deployment that did not finish). Skipping is whole-unit: every fstab
# entry systemd-remount-fs owns (/usr, API VFS such as a /tmp tmpfs or
# /proc hidepid=) is also left unremounted on a read-only /. Utah ships no
# such entries, so only operator-added fstab lines are affected; drop the
# drop-in to recover the unit on those systems. Not yet boot-verified: on a
# composefs VM, confirm
# `systemctl show -p ActiveState,ConditionResult systemd-remount-fs`
# reports `inactive`/`no` and `systemctl is-system-running` reports
# `running`.
[Unit]
ConditionPathIsReadWrite=/
