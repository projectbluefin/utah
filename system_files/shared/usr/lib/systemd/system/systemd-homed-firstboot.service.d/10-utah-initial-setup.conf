# gnome-initial-setup creates the first account on Utah (#1238). homectl
# firstboot already skips its prompt when a regular user exists (an installer
# or liveuser account), but with no user it would ask on the console before
# GDM starts, ahead of gnome-initial-setup. Keep only the non-interactive part:
# home.create.* / home.register.* credentials still create homed users.
[Service]
Environment=SYSTEMD_HOME_FIRSTBOOT_OVERRIDE=0
