# fwupd-refresh.service ships from Hummingbird's fwupd with
# `-Dsystemd_unit_user=""`, which expands the @user@ template in
# data/motd/fwupd-refresh.service.in to "DynamicUser=yes". Combined with
# the unit's CacheDirectory=fwupdmgr, every boot triggers systemd's
# pre-existing-public -> /var/cache/private migration:
#
#   fwupd-refresh.service: Found pre-existing public CacheDirectory=
#     directory /var/cache/fwupdmgr, migrating to /var/cache/private/fwupdmgr.
#   fwupd-refresh.service: Apparently, service previously had DynamicUser=
#     turned off, and has now turned it on.
#   fwupd-refresh.service: Failed to set up special execution directory
#     in /var/cache: Permission denied
#
# The migration code in systemd (src/core/dynamic-user.c) renames any
# pre-existing /var/cache/fwupdmgr into /var/cache/private/fwupdmgr so the
# dynamic user gets a UID-isolated cache. In this bootc image the rename
# returns EACCES (a policy denial on /var/cache, not a plain-ownership
# problem) and the unit exits 1 every time fwupd-refresh.timer fires.
# The daemon (fwupd.service) is unaffected: it runs as root with no
# DynamicUser= and uses CacheDirectory=fwupd (data/meson.build, prefix=/usr),
# so its cache lives under /var/cache/fwupd with no dynamic-user migration
# path. Firmware metadata stops refreshing, which is the user-visible
# symptom of #385.
#
# Pin the unit to a static user so the migration path in systemd never
# runs and /var/cache/fwupdmgr is the cache directory the unit always
# meant. The matching user is allocated by the sysusers.d fragment at
# ../../sysusers.d/utah-fwupd-refresh.conf. fwupdmgr refresh is a
# metadata download, not a firmware flash: a fixed non-root user keeps
# the daemon from running refresh code as UID 0, the same isolation
# DynamicUser=yes was meant to provide. Firmware flashing still goes
# through fwupd.service, which keeps its existing root lifecycle.
# The user name is load-bearing: upstream
# policy/org.freedesktop.fwupd.rules grants refresh-remote / get-remotes
# to subject.user == "fwupd-refresh" unconditionally, so renaming the
# user would break refresh at the polkit layer.
#
# DynamicUser=no is the load-bearing directive: User= alone leaves
# DynamicUser=yes in effect, and systemd's exec_directory_is_private()
# (src/core/execute.c) gates the pre-existing-public -> /var/cache/private
# migration on context->dynamic_user alone, not on whether User= is set.
# User= + DynamicUser=yes is a documented, legal combination in
# systemd.exec(5), but it is not the combination we want here.
#
# DynamicUser=yes also implies several hardening directives (systemd.exec(5))
# that DynamicUser=no does not, so set them explicitly to keep the same
# posture: NoNewPrivileges=yes, PrivateTmp=yes, RemoveIPC=yes,
# RestrictSUIDSGID=yes, and ProtectSystem=strict (matches upstream's
# static-user branch in data/motd/meson.build). The unit's existing
# ProtectHome=true, RestrictAddressFamilies=, SystemCallFilter=~@mount
# continue to apply.
#
[Service]
User=fwupd-refresh
Group=fwupd-refresh
DynamicUser=no
NoNewPrivileges=yes
PrivateTmp=yes
RemoveIPC=yes
RestrictSUIDSGID=yes
ProtectSystem=strict
