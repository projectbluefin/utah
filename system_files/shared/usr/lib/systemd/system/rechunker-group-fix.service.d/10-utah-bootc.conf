# Hummingbird's legacy-rechunker helper ends by running tmpfiles over the
# immutable deployment root. bootc keeps / read-only, so that final pass fails
# on root.conf's chmod of /. The earlier sysusers/rechunker steps are retained.
[Service]
ExecStart=
ExecStart=bash -c 'touch /etc/gshadow && chmod 600 /etc/gshadow'
ExecStart=bash -c 'rm /etc/gshadow'
ExecStart=systemd-sysusers
ExecStart=rechunker-group-fix
