# Candidate mitigation for the suspend hang in projectbluefin/utah#492.
# NVIDIA 595 documents 0x01 as coarse-grained runtime D3 power control:
# the GPU can still reach its lowest power state when no application uses it.
# The vendor default is 0x03 (fine-grained on supported Ampere+ notebooks,
# disabled on pre-Ampere notebooks and desktops), not universally 0x02.
# This policy is not a confirmed fix for the reported GTX 1650 Ti Mobile hang;
# affected-hardware suspend/resume and power measurements are still required.
# Keep common's suspend notifier and temporary-file options unchanged.
# modprobe appends options in filename order; this follows nvidia.conf but
# precedes zz-nvidia-suspend.conf. Later files or load-time options may override.
options nvidia NVreg_DynamicPowerManagement=0x01

