# Allocate the static user bluefin-stats-refresh.service runs as.
#
# The unit used DynamicUser=yes, which puts CacheDirectory= under
# /var/cache/private/ (mode 0700), so the stats it wrote could never be read
# by fastfetch in a user's terminal (#860). A static user keeps the job off
# UID 0 while its cache stays world-readable. Same pattern as
# utah-fwupd-refresh.conf (#385).
u bluefin-stats - "Bluefin community stats refresh"
