# Allocate the static user that fwupd-refresh.service.d/10-utah-fwupd-refresh-user.conf
# binds to. fwupd upstream ships a sysusers template
# (data/motd/fwupd.sysusers) but only installs it when
# -Dsystemd_unit_user=<name> is set; Fedora/Hummingbird's spec passes
# `-Dsystemd_unit_user=""` so the template never ships, and the user
# would otherwise not exist when our drop-in tries to set User=fwupd-refresh.
#
# Type 'u' is "create a system user". The shell is deliberately the
# systemd default (/sbin/nologin) because the user exists only to own
# the cache directory created by fwupd-refresh's CacheDirectory=fwupdmgr
# and to receive a UID for the privilege drop the unit's protect*
# directives enforce. The user has no login path and never runs a
# shell. sysusers.d(5) defaults HOME to '/' when the HOME field is
# omitted (the '-' in column 3), so the user has no writable home; the
# cache directory itself is created and managed by systemd based on
# CacheDirectory=fwupdmgr.
#
# systemd-sysusers runs at early boot from systemd-sysusers.service, which
# orders itself before local-fs.target. By the time fwupd-refresh.timer
# fires the user already exists.
#
# Closes #385.
#
u fwupd-refresh - "Firmware update refresh user"
