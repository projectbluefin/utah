# Groups that udev rules on the image assign device nodes to, but that neither
# Hummingbird nor Fedora creates:
#
#   plugdev          libfido2's upstream 70-u2f.rules (security keys) and
#                    common's 50-zsa.rules (ZSA keyboards)
#   nintendo_switch  common's 10-switch.rules (Switch RCM recovery mode)
#
# udev logged "Failed to resolve group" over a hundred times every boot for
# these, filling the boot-error section of `ujust report` (#444). Access for
# the logged-in user still comes from the rules' uaccess tags; the groups only
# make the rules resolve.
g plugdev - -
g nintendo_switch - -
