# Applied on top of every TuneD profile through /etc/tuned/post_loaded_profile
# (scripts/configure-services.sh writes it).
#
# TuneD 2.28 manages kernel arguments on bootc systems by running
# `bootc loader-entries set-options-for-source --source tuned` from its daemon
# thread on every profile apply, even for a profile with no [bootloader]
# section: it injects an empty bootloader unit just to clear stale arguments.
# That call takes the ostree sysroot lock and waits for it with no timeout.
# bootc-unified-storage.service holds that lock for its whole first-boot image
# pull (and `bootc upgrade` holds it during updates), so a power-profile switch
# from tuned-ppd at login hung TuneD behind the pull until both TuneD and its
# bootc child were killed and dumped core. Bluefin smoke's "No critical journal
# errors at boot" failed on those core dumps on nearly every run.
#
# None of the profiles tuned-ppd maps to (balanced, balanced-battery,
# powersave, throughput-performance) sets kernel arguments, so on Utah the
# bootc call only ever declared an empty set. A unit named [bootloader] in the
# merged profile stops TuneD injecting its own, and enabled=false keeps the
# plugin from loading. Kernel arguments come from bootc kargs.d, not TuneD;
# a profile chosen by hand that sets cmdline= will not apply it.
[bootloader]
enabled=false
