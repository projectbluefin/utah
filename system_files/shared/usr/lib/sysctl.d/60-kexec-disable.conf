# Copied from Dakota (projectbluefin/dakota elements/bluefin/kexec-disable.bst).
# Nothing in Utah boots through kexec (bootc upgrades and soft-reboot do not
# use it), and Epic's Easy Anti-Cheat requires it off: a kexec'd kernel would
# skip the measured boot chain. The sysctl is one-way, so it cannot be turned
# back on until reboot.
kernel.kexec_load_disabled = 1
