# The home-root directory every account lives under. /home is a symlink to
# var/home, and since /etc/default/useradd ships HOME=/home (#576), any
# `useradd --create-home` needs this directory to exist wherever it runs:
# the installer chroot on a fresh LUKS install (fisherman runs before any
# boot, so it never sees tmpfiles), the tacklebox customize container, and
# the live ISO build's own liveuser creation (#602).
#
# The directory itself ships in the image (Containerfile creates it after
# clean-stage, which strips all of /var except cache). This rule recreates
# it at boot if missing and pins root ownership, the same shape as
# utah-logrotate.conf. SELinux labelling stays with the 20-home-labels
# privileged-setup hook, which restorecons /var/home on first boot; a Z line
# here would relabel every home directory on every boot.
d /var/home 0755 root root -
