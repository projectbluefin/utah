# The home-root directory every account lives under. home.mount binds
# /var/home over the image's empty /home (#1234, as on Dakota), and
# /etc/default/useradd ships HOME=/home (#576), so this is where every
# /home/<user> really is. It must exist wherever homes are created: the
# installer pre-creates it in the stateroot, the tacklebox customize
# container and the live ISO build create liveuser's home in it (#602), and
# home.mount only binds when it is a directory.
#
# The directory itself ships in the image (Containerfile creates it after
# clean-stage, which strips all of /var except cache). This rule recreates
# it at boot if missing and pins root ownership, the same shape as
# utah-logrotate.conf. SELinux labelling stays with the 20-home-labels
# privileged-setup hook, which restorecons /var/home on first boot; a Z line
# here would relabel every home directory on every boot.
d /var/home 0755 root root -
