# gssproxy's state directories, with the owner and modes its RPM's %files
# gives them. clean-stage strips /var from the image, so on a booted Utah
# gssproxy.service's StateDirectory=gssproxy/clients gssproxy/rcache had to
# create them itself. /var/lib/gssproxy is labelled gssproxy_var_lib_t, and
# SELinux grants systemd (init_t) no add_name on that type, so the unit failed
# with status=238/STATE_DIRECTORY, Permission denied (#1269). systemd-tmpfiles
# may create and label them, and runs before any service.
d /var/lib/gssproxy 0755 root root -
d /var/lib/gssproxy/clients 0700 root root -
d /var/lib/gssproxy/rcache 0700 root root -
