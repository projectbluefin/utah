# /run/ublue-os holds the booted bootc image ref that ublue-booted-image.service
# writes (as its StandardOutput JSON) and ublue-booted-image-sync.service parses
# into the final state file. The bootc unit's StandardOutput=truncate: opens the
# JSON file at boot, so the directory must already exist before bootc runs, or
# that open fails and the unit aborts (projectbluefin/utah#1203). tmpfiles.d
# creates it early in boot, before any unit's StandardOutput truncates a file
# there. The sync script also mkdirs defensively, but that runs too late to help
# the bootc unit's own StandardOutput.
d /run/ublue-os 0755 root root -
