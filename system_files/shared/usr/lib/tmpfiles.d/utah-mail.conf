# /etc/default/useradd sets CREATE_MAIL_SPOOL=yes and login.defs points MAIL_DIR
# at /var/spool/mail, which Fedora's filesystem package creates. clean-stage
# removes /var from the image, so every useradd -- accounts-daemon's, from
# GNOME Initial Setup, included -- printed "Creating mailbox file: No such
# file or directory". Recreate the spool and Fedora's /var/mail link at boot.
d /var/spool/mail 0775 root mail -
L /var/mail - - - - spool/mail
