# The iSCSI initiator's and iSNS client's state directories, with the owners and
# modes their RPMs' %files give them (#1360). clean-stage strips /var from the
# image, so without these an `iscsiadm -m discovery` on a booted Utah would
# create the node database itself, with whatever label its own domain gets
# instead of the iscsi_var_lib_t that iscsid reads. systemd-tmpfiles creates and
# labels them before any service. The units stay off (85-utah-desktop.preset).
d /var/lib/iscsi 0755 root root -
d /var/lib/iscsi/ifaces 0755 root root -
d /var/lib/iscsi/isns 0755 root root -
d /var/lib/iscsi/nodes 0755 root root -
d /var/lib/iscsi/send_targets 0755 root root -
d /var/lib/iscsi/slp 0755 root root -
d /var/lib/iscsi/static 0755 root root -
d /var/lib/isns 0700 root root -
