# Copied from Dakota (projectbluefin/dakota files/wireplumber/51-disable-pcsp.conf,
# installed by elements/bluefin/wireplumber-pcsp.bst; projectbluefin/dakota#1248).
# Keep snd_pcsp available for console beeps without exposing its PCM card as a
# desktop audio device. Otherwise it can become the default sink after resume.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-pcspkr"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
