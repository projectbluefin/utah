# Masks systemd's /usr/lib/tmpfiles.d/root.conf (same name, /etc wins).
#
# Its one line, `z / 555`, chmods the root directory. On an installed Utah /
# is the read-only composefs overlay, so systemd-tmpfiles-setup logged
# "fchmod() of / failed: Read-only file system" on every boot, in the
# boot-error section of every `ujust report` (#444). The mode of / comes from
# the image and cannot be changed at runtime, so there is nothing to apply.
