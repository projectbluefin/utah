# Skip the CDI refresh on a machine with no NVIDIA GPU, instead of failing it.
#
# nvidia-container-toolkit-base's unit gates itself on nvidia.ko being listed
# in modules.dep, and on the NVIDIA flavors it always is: the image ships the
# module for every machine. Its next step, `nvidia-smi -L`, then cannot reach
# a driver that has no device to bind, exits non-zero, and Restart=on-failure
# retries it until the start limit trips. The service ends `failed` and takes
# nvidia-cdi-refresh.path down with it (unit-start-limit-hit) on every boot of
# a GPU-less machine: the gnome-setup E2E VM, a laptop on the wrong flavor.
#
# The test below is nvidia.ko's own MODULE_DEVICE_TABLE (kernel-open/nvidia/
# nv-pci-table.c): vendor 0x10de with class 0x030000 (VGA), 0x030200 (3D) or
# 0x068000 (NVSwitch). With none present the driver can bind nothing and the
# unit can only fail. An ExecCondition= exiting 1 skips the remaining commands
# without marking the unit failed, so Restart= never fires. With such a device
# present the unit runs exactly as NVIDIA ships it, retries included. A GPU
# that arrives later (eGPU) loads nvidia.ko, whose udev rule
# (99-nvidia-cdi-refresh.rules) starts this unit again, and the test passes.
#
# Not ConditionPathExists=/dev/nvidiactl: this unit is what creates the control
# nodes (`nvidia-ctk system create-device-nodes`), so on real hardware the
# condition could fail before the unit ever ran. Not /proc/driver/nvidia: that
# exists only once the module is loaded, and the unit's `nvidia-smi -L` is
# what loads it when nothing has yet.
[Service]
ExecCondition=/bin/sh -c 'for dev in /sys/bus/pci/devices/*; do [ "$$(cat "$$dev/vendor")" = 0x10de ] || continue; case "$$(cat "$$dev/class")" in 0x030000|0x030200|0x068000) exit 0 ;; esac; done; exit 1'
