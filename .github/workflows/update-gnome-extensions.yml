name: Update GNOME extensions

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: utah-gnome-extension-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
          submodules: true

      - name: Prepare safe extension bump report
        run: |
          python3 .github/scripts/prepare-gnome-extension-bumps.py \
            --root "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/gnome-extensions-pr.md"
          # Always run create-pull-request, including on an empty diff, so it
          # can close a stale automation PR after an upstream reversion.

      - name: Propose GNOME extension update
        id: propose
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/gnome-extension-bumps
          title: 'ci(extensions): bump pinned GNOME extensions'
          commit-message: 'ci(extensions): bump pinned GNOME extensions'
          body-path: ${{ runner.temp }}/gnome-extensions-pr.md
          # One directory covers future extension additions; only gitlinks change.
          add-paths: |
            system_files/shared/usr/share/gnome-shell/extensions

      - name: Start the contract checks on the bump branch explicitly
        if: contains(fromJSON('["created", "updated"]'), steps.propose.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        # contract_only: a dispatch is not a pull_request event, so a full
        # build here would push and sign testing images from unreviewed
        # upstream extension heads. Run the contract gates only.
        run: |
          gh workflow run build.yml --repo "$REPOSITORY" --ref automation/gnome-extension-bumps \
            -f contract_only=true
