name: Update GNOME extensions

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: utah-gnome-extension-update
  cancel-in-progress: false

jobs:
  update:
    # Only trusted main may mint the App token and open a proposal. A schedule
    # or manual dispatch on any other ref must never create a proposal.
    if: github.repository_owner == 'projectbluefin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
          submodules: true

      - name: Prepare safe extension bump report
        run: |
          python3 .github/scripts/prepare-gnome-extension-bumps.py \
            --root "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/gnome-extensions-pr.md"
          # Always run create-pull-request, including on an empty diff, so it
          # can close a stale automation PR after an upstream reversion.

      # Mint only after trusted main's preparer has validated the gitlinks.
      # Unlike GITHUB_TOKEN, an App-authenticated proposal triggers the normal
      # pull_request CI, so the ordinary contract and image-build checks answer
      # for the exact proposed head instead of a contract-only dispatch.
      - name: Get repository-scoped mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose GNOME extension update
        id: propose
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/gnome-extension-bumps
          title: 'ci(extensions): bump pinned GNOME extensions'
          commit-message: 'ci(extensions): bump pinned GNOME extensions'
          body-path: ${{ runner.temp }}/gnome-extensions-pr.md
          # One directory covers future extension additions; only gitlinks change.
          add-paths: |
            system_files/shared/usr/share/gnome-shell/extensions
