name: Status page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - packages/bluefin.toml
      - packages/utah.toml
      - scripts/generate-site-data.py
      - .github/workflows/pages.yml
  workflow_dispatch:

# Pages needs these; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half way: a cancelled
# deployment can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The committed data is what gets served, so prove it matches the
      # manifests before publishing rather than regenerating silently here.
      # A stale file is a bug in the pull request that changed the manifest,
      # and this is where it must be visible.
      - name: Package data is current
        run: python3 scripts/generate-site-data.py --check

      - name: Page structure holds
        run: python3 -m unittest tests.test_site -v

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
