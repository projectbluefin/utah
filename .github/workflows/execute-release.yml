name: Execute stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  # config/flavors.json is the single source for which images exist. Promoting
  # or releasing an image the build matrix no longer produces fails late and
  # confusingly, so this reads the same list the build does.
  variants:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: resolve
        run: echo "list=$(python3 scripts/flavors.py releases)" >> "$GITHUB_OUTPUT"

  # Whether this push is the testing-to-main promotion. The commit subject used
  # to be the only signal, which is silent when it is wrong: a merge commit
  # subject ("Merge pull request #N from .../auto/promote-testing-to-main") does
  # not match the prefix, so check-trigger succeeded, execute was skipped, the
  # workflow reported green and no :stable tag moved -- indistinguishable from an
  # ordinary merge. scripts/release-trigger.py also recognises a commit that came
  # from the promotion branch, and annotates every outcome so a skipped release
  # is legible instead of invisible.
  check-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is-promotion: ${{ steps.check.outputs.is-promotion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-trigger.py
  execute:
    needs: [check-trigger, variants]
    if: needs.check-trigger.outputs.is-promotion == 'true'
    uses: projectbluefin/actions/.github/workflows/reusable-execute-release.yml@4441ecec75c618ab0260e27e21c5aab22f750810 # v1
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
      pull-requests: write
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      variants: ${{ needs.variants.outputs.list }}
      cosign_identity_regexp: ^https://github\.com/projectbluefin/utah/\.github/workflows/build\.yml@refs/heads/testing$
      fast_forward_sha: ${{ github.sha }}
      run_release_gate: true
      gate_suites: smoke,common
    secrets: inherit
