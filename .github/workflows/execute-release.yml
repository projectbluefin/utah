name: Execute stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  # config/flavors.json is the single source for which images exist. Promoting
  # or releasing an image the build matrix no longer produces fails late and
  # confusingly, so this reads the same list the build does.
  variants:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: resolve
        run: echo "list=$(python3 scripts/flavors.py releases)" >> "$GITHUB_OUTPUT"

  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      is-promotion: ${{ steps.check.outputs.is-promotion }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT" == workflow_dispatch || "$MESSAGE" =~ ^chore:\ promote\ testing\ to\ main ]]; then echo 'is-promotion=true' >> "$GITHUB_OUTPUT"; fi
  execute:
    needs: [check-trigger, variants]
    if: needs.check-trigger.outputs.is-promotion == 'true'
    uses: projectbluefin/actions/.github/workflows/reusable-execute-release.yml@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
      pull-requests: write
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      variants: ${{ needs.variants.outputs.list }}
      cosign_identity_regexp: ^https://github\.com/projectbluefin/utah/\.github/workflows/build\.yml@refs/heads/testing$
      fast_forward_sha: ${{ github.sha }}
      run_release_gate: true
      gate_suites: smoke,common
    secrets: inherit
