name: Execute stable release

on:
  push:
    branches: [main]
  # The daily stable check: "if :stable is over a week old and :testing
  # passes, we promote it". scripts/release-trigger.py releases only when
  # :stable last moved more than 7 days ago (or is missing) and :testing points
  # at something new; every other day it says why nothing moved. 06:00 UTC
  # follows the nightly cycle: sync-main-to-testing at 22:20, the testing build
  # it dispatches (about two hours), post-testing-e2e moving :testing (one to
  # two hours more) and the 04:00 promotion-PR heartbeat. A release goes
  # through the same e2e-evidence gate and release gate as a manual run, so a
  # stale :stable with no E2E-green :testing still releases nothing.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# One release at a time; a schedule that overlaps a manual run queues, never
# cancels one mid-retag.
concurrency:
  group: utah-stable-release
  cancel-in-progress: false

permissions:
  id-token: write

jobs:
  # config/flavors.json is the single source for which images exist. Promoting
  # or releasing an image the build matrix no longer produces fails late and
  # confusingly, so this reads the same list the build does.
  variants:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: resolve
        run: echo "list=$(python3 scripts/flavors.py releases)" >> "$GITHUB_OUTPUT"

  # Whether this run releases. A push releases when it is the testing-to-main
  # promotion. The commit subject used to be the only signal, which is silent
  # when it is wrong: a merge commit subject ("Merge pull request #N from
  # .../auto/promote-testing-to-main") does not match the prefix, so
  # check-trigger succeeded, execute was skipped, the workflow reported green
  # and no :stable tag moved -- indistinguishable from an ordinary merge.
  # scripts/release-trigger.py also recognises a commit that came from the
  # promotion branch, and annotates every outcome so a skipped release is
  # legible instead of invisible. A scheduled run reads every flavor's
  # :stable and :testing digests and the last execute-release run that
  # retagged :stable; a manual dispatch always releases.
  check-trigger:
    needs: [variants]
    runs-on: ubuntu-latest
    # actions + checks: read the retag step of past execute-release runs;
    # packages: read the :stable and :testing digests (scheduled runs only).
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    outputs:
      is-promotion: ${{ steps.check.outputs.is-promotion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Authenticate to GHCR
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VARIANTS: ${{ needs.variants.outputs.list }}
        run: python3 scripts/release-trigger.py

  # The release retags what :testing points at. :testing only ever moves
  # through post-testing-e2e.yml's ratchet, but that is a convention; this
  # gate checks it. For every flavor it recovers the commit behind the :testing
  # digest and requires the E2E evidence recorded for exactly that digest on
  # exactly that commit. It never asks what the testing branch tip is, so merges
  # landing while a release runs cannot block or bless it. No evidence, no
  # release. The retag then starts from the commit-addressed tag it verified
  # rather than resolving the moving :testing tag a second time.
  e2e-evidence:
    needs: [check-trigger, variants]
    if: needs.check-trigger.outputs.is-promotion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: read
    outputs:
      variants: ${{ steps.gate.outputs.variants }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VARIANTS: ${{ needs.variants.outputs.list }}
        run: python3 scripts/promotion-ratchet.py release-gate
  execute:
    needs: [check-trigger, e2e-evidence]
    if: needs.check-trigger.outputs.is-promotion == 'true'
    uses: projectbluefin/actions/.github/workflows/reusable-execute-release.yml@3adf1194c894fe7b1ae54e583c56306c6a2382ee # v1
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
      pull-requests: write
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      # Commit-addressed source tags from the e2e-evidence gate, not :testing.
      variants: ${{ needs.e2e-evidence.outputs.variants }}
      cosign_identity_regexp: ^https://github\.com/projectbluefin/actions/\.github/workflows/reusable-build\.yml@[0-9a-f]{40}$
      fast_forward_sha: ${{ github.sha }}
      # The release gate re-runs smoke,common against the exact candidate
      # digests, with no scenario exclusions.
      run_release_gate: true
      gate_suites: smoke,common
      # The same testsuite commit post-testing-e2e.yml validated, not the
      # floating v1 tag, so the gate cannot drift from that evidence (#773).
      # tests/test_iso_ci.py keeps the two refs equal.
      gate_test_ref: 51a3941ea4cecee1a9f0c14e429515d036cf1fe3 # v1
    secrets: inherit
