name: Bump package factory pin

# The Containerfile pins ghcr.io/projectbluefin/utah-packages by digest so an
# image build is reviewable against the exact package set it consumed. Nothing
# revved that pin, so the factory published GNOME 51 finals under a new digest
# and this repository kept building against the old one until someone noticed by
# hand (#336). This makes the rev a routine pull request against `main`
# instead of a discovery.
#
# Daily, against main. Hummingbird is a rolling distribution and the factory
# republishes daily (rebuild-rpms.yml, 03:17 UTC), so a weekly rev left Utah up
# to a week behind packages that were already built. The proposal targets main
# because sync-main-to-testing force-resets testing whenever it is ahead of
# main: a bump merged into testing was wiped at the next 22:20 sync unless a
# promotion happened to land first.
#
# It opens a pull request; it never merges one. The digest diff is the review.
# A pull request opened with the default GITHUB_TOKEN fires no pull_request
# workflows, and dispatching build.yml on the branch instead would publish and
# sign its images (the reusable build pushes on every non-PR event), so CI on
# the proposal stays a manual nudge -- see docs/skills/ci-workflows.md.

on:
  schedule:
    # 07:00 UTC daily, after the factory's 03:17 rebuild has published. A day
    # with no new digest costs one registry request and opens nothing.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      pinned: ${{ steps.resolve.outputs.pinned }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: resolve
        run: |
          set -euo pipefail
          digest=$(python3 scripts/bump-factory-pin.py --print)
          pinned=$(grep -E '^ARG PACKAGE_IMAGE_SHA=' Containerfile | cut -d= -f2)
          {
            echo "digest=$digest"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"
          if [ "$digest" = "$pinned" ]; then
            echo "Factory pin already current: $pinned"
          else
            echo "Factory pin is stale: pinned $pinned, latest $digest"
          fi

  propose:
    needs: resolve
    # Nothing to propose when the registry is already serving the pinned digest.
    if: needs.resolve.outputs.digest != needs.resolve.outputs.pinned
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rewrite the pin
        run: python3 scripts/bump-factory-pin.py --digest "${{ needs.resolve.outputs.digest }}"
      - name: Propose the digest bump
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/factory-pin
          title: 'chore(deps): update projectbluefin/utah-packages docker digest'
          commit-message: 'chore(deps): update projectbluefin/utah-packages docker digest'
          body: |
            The package factory published a new digest and `ARG PACKAGE_IMAGE_SHA`
            was still serving the previous one.

            - pinned: `${{ needs.resolve.outputs.pinned }}`
            - latest: `${{ needs.resolve.outputs.digest }}`

            Proposed daily by `bump-factory-pin.yml` (#336). The pin is a
            reviewable digest, not a floating tag, so this diff is the whole
            change: the ARG plus the `# factory-pin:` stamp that keys the
            transaction's layer cache (#371).

            Opened against `main`; `testing` receives it through the sync.
            A default-token pull request fires no `pull_request` checks: push
            an empty commit to `automation/factory-pin` (or close and reopen)
            to run the build matrix before merging.
          add-paths: |
            Containerfile
            packages/utah-packages.repo
          labels: chore/deps
