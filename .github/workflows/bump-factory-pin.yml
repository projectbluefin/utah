name: Bump package factory pin

# The Containerfile pins ghcr.io/projectbluefin/utah-packages by digest so an
# image build is reviewable against the exact package set it consumed. Nothing
# revved that pin, so the factory published GNOME 51 finals under a new digest
# and this repository kept building against the old one until someone noticed by
# hand (#336). This makes the rev a routine pull request against `testing`
# instead of a discovery, on the same weekly beat the RFC proposes for stable
# promotions.
#
# It opens a pull request; it never merges one. The digest diff is the review,
# and the full build matrix runs on the pull request before a human decides.

on:
  schedule:
    # Mondays 07:00 UTC. Weekly, not daily: the factory publishes on its own
    # cadence, and a daily ping mostly re-reports the digest already pinned.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      pinned: ${{ steps.resolve.outputs.pinned }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: testing
      - id: resolve
        run: |
          set -euo pipefail
          digest=$(python3 scripts/bump-factory-pin.py --print)
          pinned=$(grep -E '^ARG PACKAGE_IMAGE_SHA=' Containerfile | cut -d= -f2)
          {
            echo "digest=$digest"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"
          if [ "$digest" = "$pinned" ]; then
            echo "Factory pin already current: $pinned"
          else
            echo "Factory pin is stale: pinned $pinned, latest $digest"
          fi

  propose:
    needs: resolve
    # Nothing to propose when the registry is already serving the pinned digest.
    if: needs.resolve.outputs.digest != needs.resolve.outputs.pinned
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: testing
      - name: Rewrite the pin
        run: python3 scripts/bump-factory-pin.py --digest "${{ needs.resolve.outputs.digest }}"
      - name: Propose the digest bump
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/factory-pin
          title: 'chore(deps): update projectbluefin/utah-packages docker digest'
          commit-message: 'chore(deps): update projectbluefin/utah-packages docker digest'
          body: |
            The package factory published a new digest and `ARG PACKAGE_IMAGE_SHA`
            was still serving the previous one.

            - pinned: `${{ needs.resolve.outputs.pinned }}`
            - latest: `${{ needs.resolve.outputs.digest }}`

            Proposed weekly by `bump-factory-pin.yml` (#336). The pin is a
            reviewable digest, not a floating tag, so this diff is the whole
            change: the ARG plus the `# factory-pin:` stamp that keys the
            transaction's layer cache (#371).

            Opened against `testing`; `main` receives it through the promotion.
          add-paths: |
            Containerfile
            packages/utah-packages.repo
          labels: chore/deps
