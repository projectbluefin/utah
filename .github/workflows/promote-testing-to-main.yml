name: Promote testing to main

on:
  push:
    branches: [testing]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  # config/flavors.json is the single source for which images exist. Promoting
  # or releasing an image the build matrix no longer produces fails late and
  # confusingly, so this reads the same list the build does.
  variants:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: resolve
        run: echo "list=$(python3 scripts/flavors.py images)" >> "$GITHUB_OUTPUT"

  promote:
    needs: variants
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@f55c40caae7abf265b1f914dae21c519d1f18716 # v1
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      variants: ${{ needs.variants.outputs.list }}
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/actions/\.github/workflows/reusable-build\.yml@[0-9a-f]{40}$
      run_e2e: false
    secrets: inherit
