name: Build Utah

on:
  pull_request:
  push:
    branches: [testing]
  # Nightly scheduling lives in sync-main-to-testing so signatures and E2E
  # consistently refer to refs/heads/testing, not the default main branch.
  workflow_dispatch:

permissions: {}

concurrency:
  group: utah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the complete transaction against the same pinned inputs as the
  # image before starting the flavor matrix, including extension build tools.
  contract:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      main_flavors: ${{ steps.flavors.outputs.main }}
      kernel_flavors: ${{ steps.flavors.outputs.kernel }}
      needs_kernel: ${{ steps.flavors.outputs.needs_kernel }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Validate manifests
        run: just check
      - name: Check Bluefin parity
        run: just check-parity
      - name: Check package availability in Utah's repositories
        run: just check-repos
      # config/flavors.json is the single source for the build, promote and
      # release matrices. It used to be four literals in three files, which is
      # one place to narrow the set and three places to forget.
      #
      # The set is split in two here, by what each flavor builds on. main uses
      # the pristine Hummingbird base; the rest use the kernel cache image. They
      # are submitted as two separate matrices below so that a kernel cache
      # miss -- twenty minutes of compiling -- holds up only the flavors that
      # consume it, instead of every image in the run.
      - name: Resolve the image flavors
        id: flavors
        run: |
          set -euo pipefail
          LIST="$(python3 scripts/flavors.py list)"
          # An empty output here does not fail loudly, it produces an invalid
          # matrix in the reusable workflow: no image job is created at all and
          # the only symptom is "build_container: failure" from the aggregator.
          test -n "$LIST" && [ "$LIST" != "[]" ]
          MAIN="$(python3 scripts/flavors.py list-main)"
          KERNEL="$(python3 scripts/flavors.py list-kernel)"
          test -n "$MAIN" && test -n "$KERNEL"
          {
            echo "main=$MAIN"
            echo "kernel=$KERNEL"
            echo "needs_kernel=$(python3 scripts/flavors.py needs-kernel)"
          } >> "$GITHUB_OUTPUT"
          echo "building $LIST: on the base image $MAIN, on the kernel cache $KERNEL"

  # The OGC kernel compile and the NVIDIA module build depend only on the base
  # image and on the two scripts that perform them, so they are hoisted out of
  # the image build into an image of their own, tagged with a hash of exactly
  # those inputs. When the tag already exists this job is a registry lookup and
  # the three flavors that need it skip roughly half an hour of compiling each.
  kernel_cache:
    needs: contract
    # Only the OGC and NVIDIA flavors unpack this. While the matrix is main-only
    # it is 45 minutes spent on an image nothing consumes.
    if: needs.contract.outputs.needs_kernel == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      # Whether the flavored builds can pull the cache image. False on a fork
      # pull request, where the kernel is compiled but cannot be published.
      available: ${{ steps.cache.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Anonymous pulls are enough to check whether the tag is published;
          # only the push needs credentials, and a fork PR has none to give.
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning title=ghcr login failed::continuing; a cache hit can still be read anonymously"
      - name: Build the kernel cache image if it is not published yet
        id: cache
        env:
          REPO_ORGANIZATION: ${{ github.repository_owner }}
          # Empty head repository means this is not a pull request at all, so
          # the comparison holds for pushes, schedules and dispatches too.
          CAN_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == ''
            || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache:$(./scripts/kernel-cache-tag.sh)"
          if podman pull -q "$ref" >/dev/null 2>&1; then
            echo "Cache hit: $ref is already published"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Cache miss: building $ref"
          podman build --tag "$ref" --file Containerfile.kernel .
          # A pull request from a fork gets a read-only GITHUB_TOKEN, so the
          # push fails no matter how well the kernel built:
          #
          #   denied: installation not allowed to Write organization package
          #
          # That is what #154, #157 and #158 have been red for -- all three
          # compiled the kernel and died publishing it, twenty minutes in, on a
          # permission no contributor can be granted from a fork. The compile is
          # the part that validates their change, so run it and say plainly that
          # the flavored images cannot be built from here.
          if [ "${CAN_PUBLISH}" != "true" ]; then
            echo "::notice title=kernel cache not published::The kernel compiled, but a fork pull request cannot write to ghcr.io/${REPO_ORGANIZATION,,}. The flavored images are not built for this PR; push the branch to projectbluefin/utah to validate them."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          podman push "$ref"
          echo "available=true" >> "$GITHUB_OUTPUT"

  # main starts the moment the contract check passes. It never pulls the kernel
  # cache, so there is no reason for it to wait on that job; before this split
  # a cache miss cost main the same twenty minutes it cost nvidia-gaming.
  build_main:
    needs: contract
    if: needs.contract.outputs.main_flavors != '[]'
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@8895d09342174927b950abc75dccd6da2c8ba36f # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah
      image_flavors: ${{ needs.contract.outputs.main_flavors }}
      stream_name: testing
      architecture: '["x86_64"]'
      # Testing is advanced only after post-testing-e2e validates the build.
      publish_stream_tag: "false"

  dispatch-iso:
    needs: [build_main, build_kernel]
    if: >-
      !cancelled() && github.ref == 'refs/heads/testing' &&
      github.event_name != 'pull_request' &&
      needs.build_main.result == 'success' &&
      (needs.build_kernel.result == 'success' || needs.build_kernel.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start ISO validation for this exact build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run post-testing-e2e.yml --repo "$REPOSITORY" --ref main \
            -f "build_run_id=$GITHUB_RUN_ID"

  # The flavors that take the kernel cache image as their base.
  #
  # brand_name differs from the call above on purpose. The reusable workflow
  # keys its own concurrency group on brand_name and stream_name with
  # cancel-in-progress, so two calls carrying the same pair would cancel each
  # other. Utah's Justfile ignores base_name when naming images (image names
  # come from the flavor alone), so the only visible effect is the name of the
  # digest artifact, which post-testing-e2e matches by glob.
  build_kernel:
    needs: [contract, kernel_cache]
    if: ${{ !cancelled() && needs.contract.result == 'success' && needs.kernel_cache.result == 'success' && needs.kernel_cache.outputs.available == 'true' && needs.contract.outputs.kernel_flavors != '[]' }}
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@8895d09342174927b950abc75dccd6da2c8ba36f # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah-kernel
      image_flavors: ${{ needs.contract.outputs.kernel_flavors }}
      stream_name: testing
      architecture: '["x86_64"]'
      publish_stream_tag: "false"
