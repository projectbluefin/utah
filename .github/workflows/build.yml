name: Build Utah

on:
  pull_request:
  # The merge queue runs only `contract` here (a required check). The pinned
  # reusable build pushes, signs, attests and opens issues for every event
  # that is not pull_request, so no image job may run on a queue ref; the
  # required `build_main / Check all testing builds successful` check comes
  # from merge-queue.yml, which builds locally and publishes nothing.
  merge_group:
  push:
    branches: [testing]
  # Nightly scheduling lives in sync-main-to-testing so signatures and E2E
  # consistently refer to refs/heads/testing, not the default main branch.
  workflow_dispatch:
    inputs:
      # A maintainer can dispatch this on an unreviewed branch. A dispatch is
      # not a pull_request event, so the reusable build would push and sign
      # testing images from content nobody has reviewed yet. contract_only
      # skips publication; review_vm can still build a local image and
      # install-test it with the gnome-setup medium in a disposable VM.
      review_vm:
        description: Build a disposable local review image and install-test it with gnome-setup (requires contract_only)
        type: boolean
        default: false
      review_all_flavors:
        description: Install-test every configured flavor (requires review_vm and contract_only)
        type: boolean
        default: false
      review_backend:
        description: bootc backend of the review medium (auto = composefs on a kernel with the btrfs fs-verity fix, else ostree)
        type: choice
        options: [auto, composefs, ostree]
        default: auto
      contract_only:
        description: Run contract checks and skip image publication
        type: boolean
        default: false
      # Sync workflow dispatches against testing and passes its observed full SHA.
      # GitHub binds each run to immutable github.sha; the contract job rejects a
      # non-empty input that differs, so contract/cache and reusable build checkouts
      # cannot diverge. A branch race fails before publication. Empty for push/PR,
      # where all jobs use github.sha.
      sha:
        description: Full commit SHA observed on testing; must match github.sha
        type: string
        default: ''

permissions: {}

# A pull request supersedes itself: a new push means the previous run is
# answering a question nobody is asking any more.
#
# A run on `testing` does not. It is the run that produces the images, and the
# one that dispatches the ISO end-to-end validation the release gate reads. When
# two land close together the older one is killed mid-build and its E2E
# dispatch dies with it -- which is why the promotion gate keeps reporting
# E2E_LAST_STATUS: skipped and refusing to promote. On 2026-09-19 two testing
# builds were cancelled within two minutes of each other (runs at 11:09 and
# 11:11), and the promotion that followed was blocked for want of the evidence
# they would have produced.
concurrency:
  group: utah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared supply-chain gate: reject mutable downloads without a verification pin.
  pinned_fetches:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-pinned-fetches.yml@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
    with:
      mode: fail

  # Resolve the complete transaction against the same pinned inputs as the
  # image before starting the flavor matrix, including extension build tools.
  contract:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      all_flavors: ${{ steps.flavors.outputs.all }}
      main_flavors: ${{ steps.flavors.outputs.main }}
      kernel_flavors: ${{ steps.flavors.outputs.kernel }}
      needs_kernel: ${{ steps.flavors.outputs.needs_kernel }}
    steps:
      - name: Validate workflow-dispatch source and publication ref
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SHA: ${{ inputs.sha }}
          CONTRACT_ONLY: ${{ inputs.contract_only }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SHA}" ]]; then
            if [[ ! "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::workflow_dispatch sha must be a full lowercase 40-hex SHA"
              exit 1
            fi
            if [[ "${INPUT_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "::error::workflow_dispatch sha must equal github.sha; refusing to validate one tree and publish another"
              exit 1
            fi
          fi
          if [[ "${CONTRACT_ONLY}" != "true" && "${GITHUB_REF}" != "refs/heads/testing" ]]; then
            echo "::error::workflow_dispatch may publish only from refs/heads/testing; use contract_only for branch previews"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetches from extension hosts can transiently return 5xx. Keep the
          # repository checkout independent from those hosts so the retry
          # policy below can recover without restarting the whole job.
          submodules: false
          # The dispatch guard requires this to equal the publisher's github.sha.
          ref: ${{ inputs.sha || github.sha }}
      - name: Checkout submodules with retry
        run: bash .github/scripts/update-submodules-with-retry.sh
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install host test dependencies
        run: python3 -m pip install -q -r tests/requirements.txt
      - name: Validate manifests
        run: just check
      - name: Run unit suite
        run: just test
      - name: Check package availability in Utah's repositories
        run: just check-repos
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify Red Hat Hardened Images signatures
        run: just verify-rhhi-signatures
      # config/flavors.json is the single source for the build, promote and
      # release matrices. It used to be four literals in three files, which is
      # one place to narrow the set and three places to forget.
      #
      # The set is split in two here. Every flavor builds on the kernel cache
      # image (its patched Fedora kernel; the OGC kernel and NVIDIA module for
      # the rest). They are still submitted as two separate matrices below: the
      # reusable build keys cancel-in-progress on brand_name, and main's
      # required check names its own call.
      - name: Resolve the image flavors
        id: flavors
        run: |
          set -euo pipefail
          LIST="$(python3 scripts/flavors.py list)"
          # An empty output here does not fail loudly, it produces an invalid
          # matrix in the reusable workflow: no image job is created at all and
          # the only symptom is "build_container: failure" from the aggregator.
          test -n "$LIST" && [ "$LIST" != "[]" ]
          MAIN="$(python3 scripts/flavors.py list-main)"
          KERNEL="$(python3 scripts/flavors.py list-kernel)"
          test -n "$MAIN" && test -n "$KERNEL"
          {
            echo "all=$LIST"
            echo "main=$MAIN"
            echo "kernel=$KERNEL"
            echo "needs_kernel=$(python3 scripts/flavors.py needs-kernel)"
          } >> "$GITHUB_OUTPUT"
          echo "building $LIST on the kernel cache: main $MAIN, the rest $KERNEL"

  # The patched Fedora kernel rebuild, the OGC kernel compile and the NVIDIA
  # module build depend only on the base image, the kernel patches and the
  # scripts that perform them, so they are hoisted out of the image build into
  # an image of their own, tagged with a hash of exactly those inputs. When the
  # tag already exists this job is a registry lookup; on a miss it is a couple
  # of hours of compiling, paid once per change to those inputs.
  kernel_cache:
    needs: contract
    # Every flavor builds FROM this image. Never on a merge group: this job
    # pushes and signs (see the merge_group trigger).
    if: github.event_name != 'merge_group' && needs.contract.outputs.needs_kernel == 'true' && !inputs.contract_only
    runs-on: ubuntu-26.04
    # cosign reads the Docker keychain (${DOCKER_CONFIG}/config.json); it never
    # looks at podman's default authfile under ${XDG_RUNTIME_DIR}/containers.
    # The two formats are identical, so pointing podman at the docker path
    # gives both tools one credential store and lets cosign push the signature.
    # Without this the image pushes and `cosign sign` fails UNAUTHORIZED.
    permissions:
      contents: read
      packages: write
      # cosign sign --yes needs the GitHub OIDC token to mint the signing
      # certificate; without id-token: write the cache image is pushed but
      # never signed, so the verification below can never pass.
      id-token: write
    outputs:
      # Whether the flavored builds can pull the cache image. False on a fork
      # pull request, where the kernel is compiled but cannot be published.
      available: ${{ steps.cache.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Contract validates this equals github.sha before any publisher can run.
          ref: ${{ inputs.sha || github.sha }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Configure isolated registry credentials
        run: |
          {
            echo "DOCKER_CONFIG=${RUNNER_TEMP}/utah-registry"
            echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/utah-registry/config.json"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          # Anonymous pulls are enough to check whether the tag is published;
          # only the push needs credentials, and a fork PR has none to give.
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning title=ghcr login failed::continuing; a cache hit can still be read anonymously"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build the kernel cache image if it is not published yet
        id: cache
        env:
          REPO_ORGANIZATION: ${{ github.repository_owner }}
          # Empty head repository means this is not a pull request at all, so
          # the comparison holds for pushes, schedules and dispatches too.
          CAN_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == ''
            || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache:$(./scripts/kernel-cache-tag.sh)"
          # The identity regexp pins signatures to this workflow and only refs
          # that may publish: same-repo PR merge refs and the trusted testing
          # branch. Dispatches on preview branches are contract-only.
          verify() {
            cosign verify "ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache@${1}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/projectbluefin/utah/\.github/workflows/build\.yml@refs/(heads/testing|pull/[0-9]+/merge)$'
          }
          if podman pull -q "$ref" >/dev/null 2>&1; then
            digest="$(podman image inspect --format '{{ index .RepoDigests 0 }}' "$ref" | cut -d@ -f2)"
            if verify "$digest"; then
              echo "Cache hit: $ref is published and signed"
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # An unsigned or wrongly-signed cache image is never adopted as a
            # base: discard it and rebuild from this checkout, so the tag ends
            # up carrying bytes this workflow produced and signed. This is also
            # how the tags that predate signing are retired -- without it the
            # first run after that change can never go green.
            echo "::warning title=unsigned kernel cache::$ref@$digest is not signed by this workflow; rebuilding and re-signing it"
            podman rmi -f "$ref" >/dev/null 2>&1 || true
          else
            echo "Cache miss: building $ref"
          fi
          podman build --tag "$ref" --file Containerfile.kernel .
          # A pull request from a fork gets a read-only GITHUB_TOKEN, so the
          # push fails no matter how well the kernel built:
          #
          #   denied: installation not allowed to Write organization package
          #
          # That is what #154, #157 and #158 have been red for -- all three
          # compiled the kernel and died publishing it, twenty minutes in, on a
          # permission no contributor can be granted from a fork. The compile is
          # the part that validates their change, so run it and say plainly that
          # the flavored images cannot be built from here.
          if [ "${CAN_PUBLISH}" != "true" ]; then
            echo "::notice title=kernel cache not published::The kernel compiled, but a fork pull request cannot write to ghcr.io/${REPO_ORGANIZATION,,}. The flavored images are not built for this PR; push the branch to projectbluefin/utah to validate them."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --digestfile reports the digest the registry accepted. `podman image
          # inspect ... RepoDigests` after a push reports the local manifest
          # digest instead, which differs, so the signature landed on a digest
          # that 404s on ghcr.io and the verify below could never pass.
          podman push --digestfile "${RUNNER_TEMP}/kernel-cache.digest" "$ref"
          digest="$(cat "${RUNNER_TEMP}/kernel-cache.digest")"
          cosign sign --yes "ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache@${digest}"
          verify "$digest"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Remove registry credentials
        if: always()
        run: rm -rf "${DOCKER_CONFIG}"

  # main takes the kernel cache image as its base for the patched Fedora kernel
  # (scripts/install-fedora-kernel.sh), so it waits for that job like the rest.
  build_main:
    needs: [contract, kernel_cache]
    if: ${{ github.event_name != 'merge_group' && !cancelled() && !inputs.contract_only && needs.contract.result == 'success' && needs.kernel_cache.result == 'success' && needs.kernel_cache.outputs.available == 'true' && needs.contract.outputs.main_flavors != '[]' }}
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah
      image_flavors: ${{ needs.contract.outputs.main_flavors }}
      stream_name: testing
      architecture: '["x86_64"]'
      # Testing is advanced only after post-testing-e2e validates the build.
      publish_stream_tag: "false"
      # Opt into rechunking + SBOM: testing is Utah's only stream and the
      # reusable workflow skips both on it by default. Overridden via
      # projectbluefin/actions#557, which the pinned reusable-build digest includes.
      rechunk: "true"

  # `just build-ghcr` checks the revision label on the local image before the
  # push (#1400). The bytes that reach ghcr.io are produced after that check --
  # the reusable build rechunks the image and pushes the result -- so read the
  # label back from the registry, by the exact digests both build calls report,
  # and fail the run if any pushed image names another commit (#1468).
  # dispatch-iso waits on this, so a mislabeled image never reaches E2E or
  # promotion. Pull requests push nothing, so there is nothing to read back.
  verify_revision:
    needs: [build_main, build_kernel]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      (needs.build_main.result == 'success' || needs.build_kernel.result == 'success')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Compare each pushed image's revision label to this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Contract validates inputs.sha equals github.sha, the commit the
          # reusable build checked out and stamped into SHA_HEAD.
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
          OWNER: ${{ github.repository_owner }}
          # A skipped build call reports an empty string; the script skips it.
          MAIN_DIGESTS: ${{ needs.build_main.outputs.digests }}
          KERNEL_DIGESTS: ${{ needs.build_kernel.outputs.digests }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          auth_dir="${RUNNER_TEMP}/utah-registry"
          mkdir -p "$auth_dir"
          trap 'rm -rf "$auth_dir"' EXIT
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/verify-pushed-revision.py "$EXPECTED_SHA" "$OWNER" \
            "$MAIN_DIGESTS" "$KERNEL_DIGESTS"

  dispatch-iso:
    needs: [build_main, build_kernel, verify_revision]
    if: >-
      !cancelled() && github.ref == 'refs/heads/testing' &&
      github.event_name != 'pull_request' && !inputs.contract_only &&
      needs.build_main.result == 'success' &&
      (needs.build_kernel.result == 'success' || needs.build_kernel.result == 'skipped') &&
      needs.verify_revision.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start ISO validation for this exact build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run post-testing-e2e.yml --repo "$REPOSITORY" --ref main \
            -f "build_run_id=$GITHUB_RUN_ID"

  # The flavors that take the kernel cache image as their base.
  #
  # brand_name differs from the call above on purpose. The reusable workflow
  # keys its own concurrency group on brand_name and stream_name with
  # cancel-in-progress, so two calls carrying the same pair would cancel each
  # other. Utah's Justfile ignores base_name when naming images (image names
  # come from the flavor alone), so the only visible effect is the name of the
  # digest artifact, which post-testing-e2e matches by glob.
  build_kernel:
    needs: [contract, kernel_cache]
    if: ${{ github.event_name != 'merge_group' && !cancelled() && !inputs.contract_only && needs.contract.result == 'success' && needs.kernel_cache.result == 'success' && needs.kernel_cache.outputs.available == 'true' && needs.contract.outputs.kernel_flavors != '[]' }}
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah-kernel
      image_flavors: ${{ needs.contract.outputs.kernel_flavors }}
      stream_name: testing
      architecture: '["x86_64"]'
      publish_stream_tag: "false"
      # Same rechunk opt-in as build_main above.
      rechunk: "true"

  review_vm:
    if: github.event_name == 'workflow_dispatch' && inputs.review_vm && inputs.contract_only
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.review_all_flavors && needs.contract.outputs.all_flavors || needs.contract.outputs.main_flavors) }}
    env:
      REVIEW_FLAVOR: ${{ matrix.flavor }}
      REVIEW_SHA: ${{ inputs.sha || github.sha }}
      REVIEW_BACKEND: ${{ inputs.review_backend || 'auto' }}
      WORK: /mnt/review-vm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Prepare disposable VM host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            qemu-system-x86 qemu-utils ovmf sshpass ffmpeg imagemagick zstd \
            tesseract-ocr swtpm swtpm-tools jq
          # Ubuntu's AppArmor profile keeps swtpm out of $WORK (raw_e2e.py --tpm).
          if [[ -f /etc/apparmor.d/usr.bin.swtpm ]]; then sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || true; fi
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p evidence output
          df -h .
      - name: Build candidate locally and record immutable bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_CACHE_WRITE: "0"
          ENABLE_SSHD: "0"
        run: |
          set -euo pipefail
          just build-ghcr utah testing "$REVIEW_FLAVOR" 2>&1 | tee evidence/image-build.log
          image_name=$(python3 scripts/flavors.py image "$REVIEW_FLAVOR")
          local_ref="localhost/${image_name}:testing"
          podman unshare skopeo inspect --raw "containers-storage:$local_ref" > evidence/payload-manifest.json
          sha256sum evidence/payload-manifest.json > evidence/payload-manifest.sha256
          podman image inspect "$local_ref" > evidence/image-inspect.json
          printf 'ghcr.io/projectbluefin/%s:review-vm-%s\n' "$image_name" "$REVIEW_SHA" > evidence/image-ref.txt
          jq -n --arg sha "$REVIEW_SHA" --arg run "$GITHUB_RUN_ID" --arg flavor "$REVIEW_FLAVOR" \
            --arg ref "$(cat evidence/image-ref.txt)" \
            --arg manifest "$(cut -d ' ' -f1 evidence/payload-manifest.sha256)" \
            '{source_sha:$sha,flavor:$flavor,vm_run:$run,image_ref:$ref,manifest_sha256:$manifest,publication:false}' \
            > evidence/provenance.json
      # The local candidate goes to root's storage on /mnt, where the medium is
      # built: iso/raw needs root (bootc install, loop devices) and the space.
      - name: Move the candidate to root's storage on /mnt
        run: |
          set -euo pipefail
          image_name=$(python3 scripts/flavors.py image "$REVIEW_FLAVOR")
          sudo mkdir -p /mnt/containers /var/lib/containers "$WORK"
          sudo mount --bind /mnt/containers /var/lib/containers
          sudo chown "$USER" "$WORK"
          podman save --format oci-archive -o "$WORK/candidate.tar" "localhost/${image_name}:testing"
          sudo podman load -q -i "$WORK/candidate.tar"
          rm -f "$WORK/candidate.tar"
          podman rmi -af >/dev/null || true
          df -h / /mnt
      # The same gnome-setup medium (iso/raw) Post-Testing E2E gates :testing
      # on (#1569), built from the local candidate instead of a published digest.
      - name: Build the gnome-setup medium from the local candidate
        run: |
          set -euo pipefail
          image_name=$(python3 scripts/flavors.py image "$REVIEW_FLAVOR")
          sudo podman build --layers=false -t localhost/utah-raw:review \
            --build-arg SOURCE_IMAGE="localhost/${image_name}:testing" -f iso/raw/Containerfile iso/raw 2>&1 | tail -150
          ssh-keygen -q -t ed25519 -N '' -f "$WORK/id_ed25519"
          sudo env UTAH_RAW_LIVE_KARGS="utah.live.debug systemd.journald.forward_to_console=1 plymouth.enable=0 rd.plymouth=0" \
            UTAH_RAW_SSH_PUBKEY="$WORK/id_ed25519.pub" UTAH_RAW_DEBUG_SSHD=1 UTAH_RAW_EVIDENCE="$WORK/raw-evidence" \
            UTAH_RAW_BACKEND="$REVIEW_BACKEND" \
            bash iso/raw/build-raw-image.sh localhost/utah-raw:review "$WORK/medium.raw" "ghcr.io/projectbluefin/${image_name}:testing"
          echo "MEDIUM_BACKEND=$(jq -r .backend "$WORK/raw-evidence/backend.json")" >> "$GITHUB_ENV"
          sudo env UTAH_RAW_EVIDENCE="$WORK/raw-evidence" bash iso/raw/bake-flatpaks.sh localhost/utah-raw:review "$WORK/medium.raw"
          sudo env UTAH_RAW_EVIDENCE="$WORK/raw-evidence" UTAH_RAW_BTRFS_COMPRESS="zstd:3" \
            bash iso/raw/shrink-raw-image.sh localhost/utah-raw:review "$WORK/medium.raw"
          sudo chown "$USER" "$WORK/medium.raw"
          sudo chown -R "$USER" "$WORK/raw-evidence"
          sudo podman rmi -af >/dev/null || true
      # Install with gnome-setup, first boot, gnome-initial-setup, desktop, then
      # bootc switch to the published :testing digest and roll back.
      - name: Install with gnome-setup, boot, switch and roll back
        run: |
          set -euo pipefail
          image_name=$(python3 scripts/flavors.py image "$REVIEW_FLAVOR")
          repo="ghcr.io/projectbluefin/${image_name}"
          candidate="$repo@$(skopeo inspect --format '{{.Digest}}' "docker://$repo:testing")"
          python3 iso/raw/raw_e2e.py --raw "$WORK/medium.raw" --work "$WORK/e2e" --install gui --tpm \
            --candidate "$candidate" --ssh-key "$WORK/id_ed25519" --backend "$MEDIUM_BACKEND" \
            --backend-decision "$WORK/raw-evidence/backend.json" \
            --flatpaks "$WORK/raw-evidence/flatpak-apps.txt" 2>&1 | tee evidence/vm-test.log
      - name: Preserve VM evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-vm-${{ matrix.flavor }}-${{ inputs.sha || github.sha }}
          retention-days: 14
