name: Build Utah

on:
  pull_request:
  push:
    branches: [testing]
  # Nightly scheduling lives in sync-main-to-testing so signatures and E2E
  # consistently refer to refs/heads/testing, not the default main branch.
  workflow_dispatch:
    inputs:
      # update-bluefin-parity.yml dispatches this on its unreviewed bump
      # branch. A dispatch is not a pull_request event, so the reusable build
      # would push and sign testing images from upstream content nobody has
      # reviewed yet. contract_only skips publication; review_vm can still
      # build a local image and offline ISO for a disposable VM test.
      review_vm:
        description: Build and VM-test a disposable local review image (requires contract_only)
        type: boolean
        default: false
      review_iso_all_flavors:
        description: Test an offline ISO for every configured flavor (requires review_vm and contract_only)
        type: boolean
        default: false
      # The review matrix normally uses test-only zstd 15 to fit all flavors.
      # Allow an explicit production level to measure the budget (#684).
      review_iso_compression_level:
        description: zstd level for the review ISO (15 = test-only; 3 = production budget)
        type: string
        default: '15'
      contract_only:
        description: Run contract checks and skip image publication
        type: boolean
        default: false
      # Sync workflow dispatches against testing and passes its observed full SHA.
      # GitHub binds each run to immutable github.sha; the contract job rejects a
      # non-empty input that differs, so contract/cache and reusable build checkouts
      # cannot diverge. A branch race fails before publication. Empty for push/PR,
      # where all jobs use github.sha.
      sha:
        description: Full commit SHA observed on testing; must match github.sha
        type: string
        default: ''

permissions: {}

# A pull request supersedes itself: a new push means the previous run is
# answering a question nobody is asking any more.
#
# A run on `testing` does not. It is the run that produces the images, and the
# one that dispatches the ISO end-to-end validation the release gate reads. When
# two land close together the older one is killed mid-build and its E2E
# dispatch dies with it -- which is why the promotion gate keeps reporting
# E2E_LAST_STATUS: skipped and refusing to promote. On 2026-09-19 two testing
# builds were cancelled within two minutes of each other (runs at 11:09 and
# 11:11), and the promotion that followed was blocked for want of the evidence
# they would have produced.
concurrency:
  group: utah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the complete transaction against the same pinned inputs as the
  # image before starting the flavor matrix, including extension build tools.
  contract:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      all_flavors: ${{ steps.flavors.outputs.all }}
      main_flavors: ${{ steps.flavors.outputs.main }}
      kernel_flavors: ${{ steps.flavors.outputs.kernel }}
      needs_kernel: ${{ steps.flavors.outputs.needs_kernel }}
    steps:
      - name: Validate workflow-dispatch source and publication ref
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SHA: ${{ inputs.sha }}
          CONTRACT_ONLY: ${{ inputs.contract_only }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SHA}" ]]; then
            if [[ ! "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::workflow_dispatch sha must be a full lowercase 40-hex SHA"
              exit 1
            fi
            if [[ "${INPUT_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "::error::workflow_dispatch sha must equal github.sha; refusing to validate one tree and publish another"
              exit 1
            fi
          fi
          if [[ "${CONTRACT_ONLY}" != "true" && "${GITHUB_REF}" != "refs/heads/testing" ]]; then
            echo "::error::workflow_dispatch may publish only from refs/heads/testing; use contract_only for branch previews"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          # The dispatch guard requires this to equal the publisher's github.sha.
          ref: ${{ inputs.sha || github.sha }}
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Validate manifests
        run: just check
      - name: Run unit suite
        # build.yml ran only `just check` (syntax gate); the tests/ tree ran
        # locally only (#650). The suite is static and needs no image build.
        run: |
          python3 -m pip install -q -r tests/requirements.txt
          just test
      - name: Check Bluefin parity
        run: just check-parity
      - name: Check package availability in Utah's repositories
        run: just check-repos
      # config/flavors.json is the single source for the build, promote and
      # release matrices. It used to be four literals in three files, which is
      # one place to narrow the set and three places to forget.
      #
      # The set is split in two here, by what each flavor builds on. main uses
      # the pristine Hummingbird base; the rest use the kernel cache image. They
      # are submitted as two separate matrices below so that a kernel cache
      # miss -- twenty minutes of compiling -- holds up only the flavors that
      # consume it, instead of every image in the run.
      - name: Resolve the image flavors
        id: flavors
        run: |
          set -euo pipefail
          LIST="$(python3 scripts/flavors.py list)"
          # An empty output here does not fail loudly, it produces an invalid
          # matrix in the reusable workflow: no image job is created at all and
          # the only symptom is "build_container: failure" from the aggregator.
          test -n "$LIST" && [ "$LIST" != "[]" ]
          MAIN="$(python3 scripts/flavors.py list-main)"
          KERNEL="$(python3 scripts/flavors.py list-kernel)"
          test -n "$MAIN" && test -n "$KERNEL"
          {
            echo "all=$LIST"
            echo "main=$MAIN"
            echo "kernel=$KERNEL"
            echo "needs_kernel=$(python3 scripts/flavors.py needs-kernel)"
          } >> "$GITHUB_OUTPUT"
          echo "building $LIST: on the base image $MAIN, on the kernel cache $KERNEL"

  # The OGC kernel compile and the NVIDIA module build depend only on the base
  # image and on the two scripts that perform them, so they are hoisted out of
  # the image build into an image of their own, tagged with a hash of exactly
  # those inputs. When the tag already exists this job is a registry lookup and
  # the three flavors that need it skip roughly half an hour of compiling each.
  kernel_cache:
    needs: contract
    # Only the OGC and NVIDIA flavors unpack this. While the matrix is main-only
    # it is 45 minutes spent on an image nothing consumes.
    if: needs.contract.outputs.needs_kernel == 'true' && !inputs.contract_only
    runs-on: ubuntu-26.04
    # cosign reads the Docker keychain (${DOCKER_CONFIG}/config.json); it never
    # looks at podman's default authfile under ${XDG_RUNTIME_DIR}/containers.
    # The two formats are identical, so pointing podman at the docker path
    # gives both tools one credential store and lets cosign push the signature.
    # Without this the image pushes and `cosign sign` fails UNAUTHORIZED.
    permissions:
      contents: read
      packages: write
      # cosign sign --yes needs the GitHub OIDC token to mint the signing
      # certificate; without id-token: write the cache image is pushed but
      # never signed, so the verification below can never pass.
      id-token: write
    outputs:
      # Whether the flavored builds can pull the cache image. False on a fork
      # pull request, where the kernel is compiled but cannot be published.
      available: ${{ steps.cache.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Contract validates this equals github.sha before any publisher can run.
          ref: ${{ inputs.sha || github.sha }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Configure isolated registry credentials
        run: |
          {
            echo "DOCKER_CONFIG=${RUNNER_TEMP}/utah-registry"
            echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/utah-registry/config.json"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          # Anonymous pulls are enough to check whether the tag is published;
          # only the push needs credentials, and a fork PR has none to give.
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning title=ghcr login failed::continuing; a cache hit can still be read anonymously"
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Build the kernel cache image if it is not published yet
        id: cache
        env:
          REPO_ORGANIZATION: ${{ github.repository_owner }}
          # Empty head repository means this is not a pull request at all, so
          # the comparison holds for pushes, schedules and dispatches too.
          CAN_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == ''
            || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache:$(./scripts/kernel-cache-tag.sh)"
          # The identity regexp pins signatures to this workflow and only refs
          # that may publish: same-repo PR merge refs and the trusted testing
          # branch. Dispatches on preview branches are contract-only.
          verify() {
            cosign verify "ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache@${1}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/projectbluefin/utah/\.github/workflows/build\.yml@refs/(heads/testing|pull/[0-9]+/merge)$'
          }
          if podman pull -q "$ref" >/dev/null 2>&1; then
            digest="$(podman image inspect --format '{{ index .RepoDigests 0 }}' "$ref" | cut -d@ -f2)"
            if verify "$digest"; then
              echo "Cache hit: $ref is published and signed"
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # An unsigned or wrongly-signed cache image is never adopted as a
            # base: discard it and rebuild from this checkout, so the tag ends
            # up carrying bytes this workflow produced and signed. This is also
            # how the tags that predate signing are retired -- without it the
            # first run after that change can never go green.
            echo "::warning title=unsigned kernel cache::$ref@$digest is not signed by this workflow; rebuilding and re-signing it"
            podman rmi -f "$ref" >/dev/null 2>&1 || true
          else
            echo "Cache miss: building $ref"
          fi
          podman build --tag "$ref" --file Containerfile.kernel .
          # A pull request from a fork gets a read-only GITHUB_TOKEN, so the
          # push fails no matter how well the kernel built:
          #
          #   denied: installation not allowed to Write organization package
          #
          # That is what #154, #157 and #158 have been red for -- all three
          # compiled the kernel and died publishing it, twenty minutes in, on a
          # permission no contributor can be granted from a fork. The compile is
          # the part that validates their change, so run it and say plainly that
          # the flavored images cannot be built from here.
          if [ "${CAN_PUBLISH}" != "true" ]; then
            echo "::notice title=kernel cache not published::The kernel compiled, but a fork pull request cannot write to ghcr.io/${REPO_ORGANIZATION,,}. The flavored images are not built for this PR; push the branch to projectbluefin/utah to validate them."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --digestfile reports the digest the registry accepted. `podman image
          # inspect ... RepoDigests` after a push reports the local manifest
          # digest instead, which differs, so the signature landed on a digest
          # that 404s on ghcr.io and the verify below could never pass.
          podman push --digestfile "${RUNNER_TEMP}/kernel-cache.digest" "$ref"
          digest="$(cat "${RUNNER_TEMP}/kernel-cache.digest")"
          cosign sign --yes "ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache@${digest}"
          verify "$digest"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Remove registry credentials
        if: always()
        run: rm -rf "${DOCKER_CONFIG}"

  # main starts the moment the contract check passes. It never pulls the kernel
  # cache, so there is no reason for it to wait on that job; before this split
  # a cache miss cost main the same twenty minutes it cost nvidia-gaming.
  build_main:
    needs: contract
    if: needs.contract.outputs.main_flavors != '[]' && !inputs.contract_only
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@d0abf8999cf9fe16d2ef5bdc2a42a91ce8809645 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah
      image_flavors: ${{ needs.contract.outputs.main_flavors }}
      stream_name: testing
      architecture: '["x86_64"]'
      # Testing is advanced only after post-testing-e2e validates the build.
      publish_stream_tag: "false"
      # Opt into rechunking + SBOM: testing is Utah's only stream and the
      # reusable workflow skips both on it by default. Overridden via
      # projectbluefin/actions#557, which the pinned reusable-build digest includes.
      rechunk: "true"

  dispatch-iso:
    needs: [build_main, build_kernel]
    if: >-
      !cancelled() && github.ref == 'refs/heads/testing' &&
      github.event_name != 'pull_request' && !inputs.contract_only &&
      needs.build_main.result == 'success' &&
      (needs.build_kernel.result == 'success' || needs.build_kernel.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start ISO validation for this exact build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run post-testing-e2e.yml --repo "$REPOSITORY" --ref main \
            -f "build_run_id=$GITHUB_RUN_ID"

  # The flavors that take the kernel cache image as their base.
  #
  # brand_name differs from the call above on purpose. The reusable workflow
  # keys its own concurrency group on brand_name and stream_name with
  # cancel-in-progress, so two calls carrying the same pair would cancel each
  # other. Utah's Justfile ignores base_name when naming images (image names
  # come from the flavor alone), so the only visible effect is the name of the
  # digest artifact, which post-testing-e2e matches by glob.
  build_kernel:
    needs: [contract, kernel_cache]
    if: ${{ !cancelled() && !inputs.contract_only && needs.contract.result == 'success' && needs.kernel_cache.result == 'success' && needs.kernel_cache.outputs.available == 'true' && needs.contract.outputs.kernel_flavors != '[]' }}
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@d0abf8999cf9fe16d2ef5bdc2a42a91ce8809645 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah-kernel
      image_flavors: ${{ needs.contract.outputs.kernel_flavors }}
      stream_name: testing
      architecture: '["x86_64"]'
      publish_stream_tag: "false"
      # Same rechunk opt-in as build_main above.
      rechunk: "true"

  review_vm:
    if: github.event_name == 'workflow_dispatch' && inputs.review_vm && inputs.contract_only
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.review_iso_all_flavors && needs.contract.outputs.all_flavors || needs.contract.outputs.main_flavors) }}
    env:
      REVIEW_FLAVOR: ${{ matrix.flavor }}
      REVIEW_SHA: ${{ inputs.sha || github.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Prepare disposable VM host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            squashfs-tools xorriso dosfstools mtools qemu-system-x86 qemu-utils \
            ovmf sshpass ffmpeg tesseract-ocr
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p evidence output
          df -h .
      - name: Build candidate locally and record immutable bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_CACHE_WRITE: "0"
          ENABLE_SSHD: "0"
        run: |
          set -euo pipefail
          just build-ghcr utah testing "$REVIEW_FLAVOR" 2>&1 | tee evidence/image-build.log
          image_name=$(python3 scripts/flavors.py image "$REVIEW_FLAVOR")
          local_ref="localhost/${image_name}:testing"
          podman unshare skopeo inspect --raw "containers-storage:$local_ref" > evidence/payload-manifest.json
          sha256sum evidence/payload-manifest.json > evidence/payload-manifest.sha256
          podman image inspect "$local_ref" > evidence/image-inspect.json
          printf 'ghcr.io/projectbluefin/%s:review-vm-%s\n' "$image_name" "$REVIEW_SHA" > evidence/image-ref.txt
          jq -n --arg sha "$REVIEW_SHA" --arg run "$GITHUB_RUN_ID" --arg flavor "$REVIEW_FLAVOR" \
            --arg ref "$(cat evidence/image-ref.txt)" \
            --arg manifest "$(cut -d ' ' -f1 evidence/payload-manifest.sha256)" \
            '{source_sha:$sha,flavor:$flavor,vm_run:$run,image_ref:$ref,manifest_sha256:$manifest,publication:false}' \
            > evidence/provenance.json
      - name: Compose offline debug ISO from the local candidate
        env:
          UTAH_ISO_WORKDIR: ${{ runner.temp }}
          # Test-only compression keeps every flavor under the ISO ceiling so
          # this opt-in matrix can reach the install/boot checks. Production
          # callers retain the builder's default compression level; dispatch
          # with review_iso_compression_level=3 to measure against it.
          UTAH_ISO_COMPRESSION_LEVEL: ${{ inputs.review_iso_compression_level || '15' }}
        run: |
          set -euo pipefail
          image_ref=$(cat evidence/image-ref.txt)
          image_name=$(python3 scripts/flavors.py image "$REVIEW_FLAVOR")
          rc=0
          bash iso/scripts/build-iso.sh "localhost/${image_name}:testing" "$PWD/output/utah-review.iso" \
            "Utah Review $REVIEW_FLAVOR" 1 "$image_ref" 2>&1 | tee evidence/iso-build.log || rc=$?
          # Record the size before honoring the budget guard so diagnostics
          # still answer how far above/below budget the image landed.
          if [ -f output/utah-review.iso ]; then
            jq -n --arg flavor "$REVIEW_FLAVOR" --arg level "$UTAH_ISO_COMPRESSION_LEVEL" \
              --argjson bytes "$(du -b output/utah-review.iso | cut -f1)" \
              '{flavor:$flavor,compression_level:($level|tonumber),iso_bytes:$bytes,iso_mib:($bytes/1048576|floor)}' \
              > evidence/iso-size.json
            cat evidence/iso-size.json
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          sha256sum output/utah-review.iso > evidence/iso.sha256
      - name: Boot live desktop, install LUKS, log in and test review fixes
        env:
          UTAH_E2E_WORK: ${{ runner.temp }}/utah-review-vm
          UTAH_E2E_REQUIRE_SCREENSHOTS: "1"
          UTAH_E2E_REQUIRE_FASTFETCH: "1"
          UTAH_E2E_RAM: "6144"
          UTAH_E2E_CPUS: "2"
          UTAH_E2E_EXPECT_FLAVOR: ${{ matrix.flavor }}
          UTAH_E2E_README: none
        run: |
          set -euo pipefail
          image_ref=$(cat evidence/image-ref.txt)
          bash iso/scripts/luks-e2e.sh "$PWD/output/utah-review.iso" "$image_ref" \
            2>&1 | tee evidence/vm-test.log
          booted_digest=$(jq -r .status.booted.image.imageDigest "$UTAH_E2E_WORK/bootc-status.json")
          expected_digest="sha256:$(cut -d ' ' -f1 evidence/payload-manifest.sha256)"
          test "$booted_digest" = "$expected_digest"
          cp "$UTAH_E2E_WORK/bootc-status.json" "$UTAH_E2E_WORK/flavor-checks.json" evidence/
      - name: Preserve VM evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-vm-${{ matrix.flavor }}-${{ inputs.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/
            ${{ runner.temp }}/utah-review-vm/*.log
            ${{ runner.temp }}/utah-review-vm/*.json
            ${{ runner.temp }}/utah-review-vm/fastfetch-ocr.txt
            ${{ runner.temp }}/utah-review-vm/screenshots/
