name: Refresh image baselines

# Re-measures Utah against the published Bluefin and Dakota images (see
# scripts/image-baseline.py) and proposes the refreshed snapshots as a pull
# request. The contract job's `just check` then fails that pull request if a
# Bluefin package Utah lacks is not in baselines/triage.toml, so a new gap
# cannot land without a decision.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-baselines
  cancel-in-progress: true

jobs:
  refresh:
    # Only trusted main may mint the App token and open a proposal. A schedule
    # or manual dispatch on any other ref must never create a proposal.
    if: github.repository_owner == 'projectbluefin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Free disk for two desktop images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: just baselines
      # Mint only after the measurement has run. Unlike GITHUB_TOKEN, an
      # App-authenticated proposal triggers the normal pull_request CI, so the
      # required contract and image-build checks report on the proposed head
      # and the PR's author is the trusted mergeraptor bot.
      - name: Get repository-scoped mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose refreshed baselines
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/image-baselines
          title: 'chore(baselines): refresh Bluefin, Dakota and Utah image baselines'
          commit-message: 'chore(baselines): refresh Bluefin, Dakota and Utah image baselines'
          body: |
            Weekly re-measurement by `just baselines`. Read `baselines/GAP.md`:
            rows marked **new** are Bluefin packages Utah lacks that are not yet
            in `baselines/triage.toml`, and `just check` fails until each one is
            triaged. Drop entries the check reports as no longer gaps.
          add-paths: |
            baselines/**
