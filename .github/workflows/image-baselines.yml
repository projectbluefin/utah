name: Refresh image baselines

# Re-measures Utah against the published Bluefin and Dakota images (see
# scripts/image-baseline.py) and proposes the refreshed snapshots as a pull
# request. The contract job's `just check` then fails that pull request if a
# Bluefin package Utah lacks is not in baselines/triage.toml, so a new gap
# cannot land without a decision.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-baselines
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Free disk for two desktop images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: just baselines
      - name: Propose refreshed baselines
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/image-baselines
          title: 'chore(baselines): refresh Bluefin, Dakota and Utah image baselines'
          commit-message: 'chore(baselines): refresh Bluefin, Dakota and Utah image baselines'
          body: |
            Weekly re-measurement by `just baselines`. Read `baselines/GAP.md`:
            rows marked **new** are Bluefin packages Utah lacks that are not yet
            in `baselines/triage.toml`, and `just check` fails until each one is
            triaged. Drop entries the check reports as no longer gaps.
          add-paths: |
            baselines/**
