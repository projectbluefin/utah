name: Native Common candidate

on:
  workflow_dispatch:
    inputs:
      common_sha:
        description: Exact projectbluefin/common source commit
        required: true
        type: string

permissions: {}

jobs:
  pinned_fetches:
    if: github.repository == 'projectbluefin/utah' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-pinned-fetches.yml@d8f31e9ac688e15883c4a673aa389ac7cf76beab # v1
    with:
      mode: fail

  source:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      consumer_sha: ${{ steps.source.outputs.consumer_sha }}
      matrix: ${{ steps.source.outputs.matrix }}
      testsuite_sha: ${{ steps.source.outputs.testsuite_sha }}
      common_layer_digest: ${{ steps.common.outputs.digest }}
    steps:
      - name: Reject untrusted workflow refs and invalid source inputs
        env:
          COMMON_SHA: ${{ inputs.common_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = projectbluefin/utah
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$COMMON_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "consumer_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -c '{include: [.flavors[] as $f | {flavor:$f,suites:.suites[$f]}]}' config/flavors.json | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          # The testsuite job below holds packages: write, so it runs only the
          # reviewed testsuite commit Renovate tracks as v1 (the pin
          # post-testing-e2e.yml uses). The manifest records that pin, read
          # from this exact workflow file, never a dispatch input.
          workflow=.github/workflows/candidate-common.yml
          uses_sha=$(sed -n 's|^    uses: projectbluefin/testsuite/\.github/workflows/e2e\.yml@\([0-9a-f]\{40\}\) # v1$|\1|p' "$workflow")
          ref_sha=$(sed -n 's|^      test_ref: \([0-9a-f]\{40\}\) # v1$|\1|p' "$workflow")
          [[ "$uses_sha" =~ ^[a-f0-9]{40}$ && "$ref_sha" == "$uses_sha" ]]
          echo "testsuite_sha=$uses_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare source-only Common builder
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo
      - id: common
        name: Build exact Common source without inherited environment or auth
        env:
          COMMON_SHA: ${{ inputs.common_sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/common-source"
          mkdir -p "$work/home" "$work/auth" "$work/runtime"
          chmod 0700 "$work/runtime"
          env -i PATH="$PATH" HOME="$work/home" git init "$work/repo"
          env -i PATH="$PATH" HOME="$work/home" git -C "$work/repo" remote add origin https://github.com/projectbluefin/common.git
          # Owner decision on #1214: candidates are built only from Common
          # commits on main. Unreviewed Common code never reaches a job that
          # holds packages: write.
          env -i PATH="$PATH" HOME="$work/home" git -C "$work/repo" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! env -i PATH="$PATH" HOME="$work/home" git -C "$work/repo" merge-base --is-ancestor "$COMMON_SHA" refs/remotes/origin/main; then
            echo "::error::common_sha $COMMON_SHA is not a commit on projectbluefin/common main; candidates are built only from merged Common commits."
            exit 1
          fi
          env -i PATH="$PATH" HOME="$work/home" git -C "$work/repo" checkout --detach "$COMMON_SHA"
          test "$(git -C "$work/repo" rev-parse 'HEAD^{commit}')" = "$COMMON_SHA"
          env -i PATH="$PATH" HOME="$work/home" git -C "$work/repo" submodule update --init --recursive
          # env -i leaves podman no user D-Bus session, so it falls back to the
          # cgroupfs manager for itself, but the build's RUN containers still
          # asked crun for systemd cgroups over the system bus and were refused
          # ("sd-bus call: Access denied ... interactive authentication",
          # run 45926387896). Name cgroupfs for the whole build.
          env -i PATH="$PATH" HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" REGISTRY_AUTH_FILE="$work/auth/config.json" DOCKER_CONFIG="$work/auth" \
            podman --cgroup-manager=cgroupfs build --file "$work/repo/Containerfile" --tag localhost/common:candidate "$work/repo"
          env -i PATH="$PATH" HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" podman save --format oci-archive --output "$RUNNER_TEMP/common.oci.tar" localhost/common:candidate
          digest=$(env -i PATH="$PATH" HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" skopeo inspect --raw "oci-archive:$RUNNER_TEMP/common.oci.tar" | sha256sum | cut -d ' ' -f1)
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: common-local-layer
          path: ${{ runner.temp }}/common.oci.tar
          if-no-files-found: error
          retention-days: 1

  candidate:
    needs: [source, pinned_fetches]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.consumer_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: common-local-layer
          path: ${{ runner.temp }}
      - name: Prepare native build and boot host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            qemu-system-x86 qemu-utils ovmf sshpass ffmpeg imagemagick zstd jq \
            tesseract-ocr swtpm swtpm-tools
          # Ubuntu's AppArmor profile keeps swtpm out of the work dir (raw_e2e.py --tpm).
          if [[ -f /etc/apparmor.d/usr.bin.swtpm ]]; then sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || true; fi
          # The mode bits, as the review VM and the installer E2E grant it. A setfacl
          # grant did not last (run 45950837602): the live VM ran with
          # `-accel kvm`, but by the installed VM /dev/kvm was no longer writable,
          # raw_e2e.py fell back to `-accel tcg`, and the first boot was too slow
          # for /boot's 90s device timeout (emergency mode). KVM sends a uevent
          # per VM, and udev's re-run on it likely dropped the manual ACL.
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p output evidence
          podman load --input "$RUNNER_TEMP/common.oci.tar"
      - name: Run native source and package contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install -q -r tests/requirements.txt
          just check
          just test
          auth=$(mktemp -d "$RUNNER_TEMP/contracts-auth.XXXXXX")
          trap 'rm -rf "$auth"' EXIT
          export REGISTRY_AUTH_FILE="$auth/auth.json"
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          just check-repos
      - name: Build native image on verified kernel cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # COMMON_IMAGE/COMMON_IMAGE_SHA go with the override so provenance.json
          # records the candidate's Common layer digest, not the pinned one.
          COMMON_IMAGE_REF: localhost/common:candidate
          COMMON_IMAGE: localhost/common
          COMMON_IMAGE_SHA: ${{ needs.source.outputs.common_layer_digest }}
          REGISTRY_CACHE_WRITE: "0"
          ENABLE_SSHD: "0"
          FLAVOR: ${{ matrix.flavor }}
          COMMON_LAYER_DIGEST: ${{ needs.source.outputs.common_layer_digest }}
          COMMON_SHA: ${{ inputs.common_sha }}
          CONSUMER_SHA: ${{ needs.source.outputs.consumer_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          loaded=$(podman unshare skopeo inspect --raw containers-storage:localhost/common:candidate | sha256sum | cut -d ' ' -f1)
          test "sha256:$loaded" = "$COMMON_LAYER_DIGEST"
          just build-ghcr utah testing "$FLAVOR" 2>&1 | tee evidence/image-build.log
          image=$(python3 scripts/flavors.py image "$FLAVOR")
          tag="common-$COMMON_SHA-$CONSUMER_SHA-$GITHUB_RUN_ID"
          local_ref="localhost/$image:$tag"
          built_ref="localhost/$image:testing"
          canonical=$(mktemp -d "$RUNNER_TEMP/candidate-image.XXXXXX")
          podman unshare skopeo copy --dest-compress --dest-compress-format gzip "containers-storage:$built_ref" "dir:$canonical"
          podman rmi --no-prune "$built_ref"
          podman unshare skopeo copy --preserve-digests "dir:$canonical" "containers-storage:$local_ref"
          podman tag "$local_ref" "$built_ref"
          echo "$local_ref" > evidence/local-ref.txt
          echo "ghcr.io/projectbluefin/$image:$tag" > evidence/publish-ref.txt
          podman unshare skopeo inspect --raw "containers-storage:$local_ref" > evidence/payload-manifest.json
          cmp "$canonical/manifest.json" evidence/payload-manifest.json
          rm -rf "$canonical"
          sha256sum evidence/payload-manifest.json > evidence/payload-manifest.sha256
          just check-desktop-contract "$local_ref"
      # Install-test the local candidate with the gnome-setup medium (iso/raw),
      # the install Post-Testing E2E gates :testing on (#1569). The medium is
      # built in root's storage on /mnt; the candidate stays in this user's
      # storage for the publish step below.
      - name: Build the gnome-setup medium from the local candidate
        env:
          WORK: /mnt/candidate
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          ref=$(cat evidence/local-ref.txt)
          image=$(python3 scripts/flavors.py image "$FLAVOR")
          sudo mkdir -p /mnt/containers /var/lib/containers "$WORK"
          sudo mount --bind /mnt/containers /var/lib/containers
          sudo chown "$USER" "$WORK"
          podman save --format oci-archive -o "$WORK/candidate.tar" "$ref"
          sudo podman load -q -i "$WORK/candidate.tar"
          rm -f "$WORK/candidate.tar"
          sudo podman build --layers=false -t localhost/utah-raw:candidate \
            --build-arg SOURCE_IMAGE="$ref" -f iso/raw/Containerfile iso/raw 2>&1 | tail -150
          ssh-keygen -q -t ed25519 -N '' -f "$WORK/id_ed25519"
          sudo env UTAH_RAW_LIVE_KARGS="utah.live.debug systemd.journald.forward_to_console=1 plymouth.enable=0 rd.plymouth=0" \
            UTAH_RAW_SSH_PUBKEY="$WORK/id_ed25519.pub" UTAH_RAW_DEBUG_SSHD=1 UTAH_RAW_EVIDENCE="$WORK/raw-evidence" \
            bash iso/raw/build-raw-image.sh localhost/utah-raw:candidate "$WORK/medium.raw" "ghcr.io/projectbluefin/$image:testing"
          echo "MEDIUM_BACKEND=$(jq -r .backend "$WORK/raw-evidence/backend.json")" >> "$GITHUB_ENV"
          sudo env UTAH_RAW_EVIDENCE="$WORK/raw-evidence" bash iso/raw/bake-flatpaks.sh localhost/utah-raw:candidate "$WORK/medium.raw"
          sudo env UTAH_RAW_EVIDENCE="$WORK/raw-evidence" UTAH_RAW_BTRFS_COMPRESS="zstd:3" \
            bash iso/raw/shrink-raw-image.sh localhost/utah-raw:candidate "$WORK/medium.raw"
          sudo chown "$USER" "$WORK/medium.raw"
          sudo chown -R "$USER" "$WORK/raw-evidence"
          sudo podman rmi -af >/dev/null || true
      - name: Install with gnome-setup, boot, switch and roll back
        env:
          WORK: /mnt/candidate
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          image=$(python3 scripts/flavors.py image "$FLAVOR")
          repo="ghcr.io/projectbluefin/$image"
          candidate="$repo@$(skopeo inspect --format '{{.Digest}}' "docker://$repo:testing")"
          python3 iso/raw/raw_e2e.py --raw "$WORK/medium.raw" --work "$WORK/e2e" --install gui --tpm \
            --candidate "$candidate" --ssh-key "$WORK/id_ed25519" --backend "$MEDIUM_BACKEND" \
            --backend-decision "$WORK/raw-evidence/backend.json" \
            --flatpaks "$WORK/raw-evidence/flatpak-apps.txt" 2>&1 | tee evidence/install-test.log
          rm -f "$WORK/medium.raw"
      - name: Publish only tested candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          auth=$(mktemp -d "$RUNNER_TEMP/candidate-auth.XXXXXX")
          trap 'rm -rf "$auth"' EXIT
          export REGISTRY_AUTH_FILE="$auth/auth.json"
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref=$(cat evidence/publish-ref.txt)
          skopeo list-tags "docker://${ref%:*}" > evidence/registry-tags.json
          jq -e --arg tag "${ref##*:}" '.Tags | index($tag) == null' evidence/registry-tags.json
          podman push --compression-format gzip --force-compression=false --digestfile evidence/pushed.digest "$(cat evidence/local-ref.txt)" "docker://$ref"
          digest=$(cat evidence/pushed.digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$digest" = "sha256:$(cut -d ' ' -f1 evidence/payload-manifest.sha256)"
          exact="${ref%:*}@$digest"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://$exact")" = "$digest"
          jq -n --arg flavor "$FLAVOR" --arg digest "$digest" --arg ref "$exact" '{flavor:$flavor,digest:$digest,ref:$ref}' > evidence/candidate-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-image-${{ matrix.flavor }}
          path: evidence/candidate-image.json
          if-no-files-found: error
      - name: Retain diagnostics without test disks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-evidence-${{ matrix.flavor }}
          path: |
            evidence/
            /mnt/candidate/e2e/screenshots/
            /mnt/candidate/e2e/evidence/
            /mnt/candidate/e2e/*.log
            /mnt/candidate/raw-evidence/
          retention-days: 14

  manifest:
    needs: [source, candidate]
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: candidate-image-*
          path: images
      - id: manifest
        env:
          COMMON_SHA: ${{ inputs.common_sha }}
          CONSUMER_SHA: ${{ needs.source.outputs.consumer_sha }}
          TESTSUITE_SHA: ${{ needs.source.outputs.testsuite_sha }}
          COMMON_LAYER_DIGEST: ${{ needs.source.outputs.common_layer_digest }}
          FLAVORS: ${{ needs.source.outputs.matrix }}
        run: |
          set -euo pipefail
          jq -s --arg common "$COMMON_SHA" --arg consumer "$CONSUMER_SHA" --arg tests "$TESTSUITE_SHA" --arg layer "$COMMON_LAYER_DIGEST" \
            '{common_sha:$common,consumer_sha:$consumer,testsuite_sha:$tests,common_layer_digest:$layer,images:sort_by(.flavor)}' images/*/candidate-image.json > candidate-manifest.json
          jq -e --argjson flavors "$FLAVORS" '([.images[].flavor]|sort) == ([$flavors.include[].flavor]|sort) and all(.images[]; (.digest|test("^sha256:[a-f0-9]{64}$")) and (.ref == ("ghcr.io/projectbluefin/" + (if .flavor == "main" then "utah" else "utah-" + .flavor end) + "@" + .digest)))' candidate-manifest.json
          matrix=$(jq -c --argjson flavors "$FLAVORS" '{include:[.images[] as $i | $flavors.include[] | select(.flavor==$i.flavor) | . + {ref:$i.ref}]}' candidate-manifest.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-manifest
          path: candidate-manifest.json
          if-no-files-found: error

  testsuite:
    needs: manifest
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    # The reviewed testsuite v1 commit, the one post-testing-e2e.yml runs: this
    # job holds packages: write, so it must never call unmerged testsuite code.
    # Renovate moves the uses: digest and test_ref together.
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@1fba41c3346f3be5865e43c0b3dddab6b4f4dbb3 # v1
    with:
      image: ${{ matrix.ref }}
      compose_image: false
      suites: ${{ matrix.suites }}
      test_repository: projectbluefin/testsuite
      test_ref: 1fba41c3346f3be5865e43c0b3dddab6b4f4dbb3 # v1
