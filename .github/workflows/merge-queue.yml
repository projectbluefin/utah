name: Merge queue image build

# The `main` ruleset requires `build_main / Check all testing builds
# successful`, the aggregate check of build.yml's call to the pinned
# projectbluefin/actions reusable build. That workflow pushes, signs, attests
# and opens issues for every event other than pull_request, so build.yml never
# calls it on a merge group. This workflow reports the same check name on the
# queue's commit instead, and earns it the way a pull request does: it builds
# every base-image flavor on the runner with `just build-ghcr`, the local path
# review_vm already uses, and publishes nothing. Its token can read packages
# (the private layer cache) and nothing else; REGISTRY_CACHE_WRITE=0 keeps the
# recipe from even asking to write the layer cache.
#
# It runs only on merge_group. A job with this name in build.yml would report
# a second, skipped check of the same name on every pull request. `contract`,
# the other required check, comes from build.yml itself.
#
# No concurrency group: every merge group has its own ref, and a group the
# queue drops is not superseded by another one on the same ref.
on:
  merge_group:

permissions: {}

jobs:
  flavors:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      main: ${{ steps.flavors.outputs.main }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Same source and split as build.yml's contract job: build_main builds
      # the flavors on the pristine Hummingbird base.
      - name: Resolve the base-image flavors
        id: flavors
        run: |
          set -euo pipefail
          MAIN="$(python3 scripts/flavors.py list-main)"
          test -n "$MAIN" && [ "$MAIN" != "[]" ]
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          echo "building $MAIN without publishing"

  image:
    needs: flavors
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.flavors.outputs.main) }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Prepare the build host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs
          df -h .
      - name: Build the image locally, publishing nothing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_CACHE_WRITE: "0"
          ENABLE_SSHD: "0"
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          just build-ghcr utah testing "$FLAVOR"

  check:
    name: build_main / Check all testing builds successful
    needs: [flavors, image]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      # Unlike the reusable aggregate, skipped is not success here: a skipped
      # image job means no flavor was built.
      - name: Every base-image flavor built
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$JOBS" | jq -r 'to_entries[] | " - \(.key): \(.value.result)"'
          test "$(echo "$JOBS" | jq '[.[] | select(.result != "success")] | length')" -eq 0
