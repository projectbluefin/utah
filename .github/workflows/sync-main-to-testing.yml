name: Sync main to testing

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/verification/**
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@59df69d574d2cb811eb27a73eeaafe87c1beb64a # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Capture the commit testing points at right now -- the SHA
          # reusable-sync-branches either fast-forwarded to or force-reset
          # testing to in the `sync` job above. Passing it to build.yml as the
          # `target_sha` dispatch input pins every checkout in that run to this
          # exact commit, so the build cannot drift to a different testing
          # tip between this API call and the runner actually starting (#371).
          # The dispatch API itself refuses a SHA as `ref` ("No ref found for:
          # <hash>"), so the ref stays as the floating branch name and the
          # build uses the captured SHA as its checkout ref.
          TARGET_SHA="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/git/ref/heads/testing" \
              --jq '.object.sha')"
          echo "Dispatching build.yml against testing@$TARGET_SHA"
          gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
              -f "target_sha=$TARGET_SHA"
