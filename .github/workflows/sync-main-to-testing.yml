name: Sync main to testing

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/verification/**
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@ae7d740d261d56354aeaf0a72af6f87e442e0472 # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      # The target_sha capture runs `gh api git/ref/heads/testing`. Today the
      # endpoint allows public read without authentication, but a future
      # visibility change would surface as a 404 here. Grant read explicitly
      # so the capture is robust regardless of repo visibility (#562).
      contents: read
    steps:
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The shared workflow has no output for its actual fetched source.
          # Keep the target capture and also pass this workflow's immutable
          # source commit as an ancestry floor. Comparing target to itself
          # would always return identical and cannot detect a stale capture.
          TARGET_SHA="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/git/ref/heads/testing" \
              --jq '.object.sha')"
          echo "Dispatching build.yml against testing@$TARGET_SHA"
          gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
              -f "target_sha=$TARGET_SHA" \
              -f "expected_source_sha=$SOURCE_SHA"
