name: Sync main to testing

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/verification/**
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@3adf1194c894fe7b1ae54e583c56306c6a2382ee # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      # Dispatch against the testing ref and pass its current full SHA. build.yml
      # rejects an input that differs from the run's github.sha before any publisher
      # runs, so a branch race fails closed instead of publishing a different tree.
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHA="$(gh api "repos/$REPOSITORY/commits/testing" --jq .sha)"
          test -n "$SHA"
          gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
            -f sha="$SHA"
