name: Sync main to testing

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/verification/**
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@ae7d740d261d56354aeaf0a72af6f87e442e0472 # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      # The target_sha capture runs `gh api git/ref/heads/testing`. Today the
      # endpoint allows public read without authentication, but a future
      # visibility change would surface as a 404 here. Grant read explicitly
      # so the capture is robust regardless of repo visibility (#562).
      contents: read
    steps:
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Capture the SHA reusable-sync-branches just fast-forwarded or
          # force-reset testing to. The dispatch API still resolves --ref
          # testing at acceptance time, so the build's contract job asserts
          # the two SHAs agree; a mismatch means testing moved between this
          # capture and the dispatch, and the run fails loudly instead of
          # silently building a different tree (#371). `gh workflow run`
          # does not expose a JSON output mode (only the dispatch URL on
          # stdout), so the dispatched run cannot be queried in-process to
          # confirm the SHA it accepted; the build.yml assertion is the
          # single source of truth. The reverse skew (stale `git/ref/heads/testing`
          # read AND stale dispatch resolution both serving the pre-sync SHA)
          # is not catchable from inside this repo; it lands as the next nightly
          # catching up. See ci-workflows.md for the full operator-facing
          # description of the false-positive and false-negative directions.
          TARGET_SHA="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/git/ref/heads/testing" \
              --jq '.object.sha')"
          echo "Dispatching build.yml against testing@$TARGET_SHA"
          gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
              -f "target_sha=$TARGET_SHA"
