name: Sync main to testing

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/verification/**
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@f55c40caae7abf265b1f914dae21c519d1f18716 # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      # Dispatch against the floating ref but pin the checkout to the SHA the
      # sync just pushed. A job that resolves `testing` seconds later can
      # otherwise land on the pre-push commit and build stale inputs under a
      # fresh version stamp (#371); build.yml pins every checkout to this SHA.
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHA="$(gh api "repos/$REPOSITORY/commits/testing" --jq .sha)"
          test -n "$SHA"
          gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
            -f sha="$SHA"
