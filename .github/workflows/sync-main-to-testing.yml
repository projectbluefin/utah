name: Sync main to testing

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/verification/**
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@ae7d740d261d56354aeaf0a72af6f87e442e0472 # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Capture the SHA reusable-sync-branches just fast-forwarded or
          # force-reset testing to. The dispatch API still resolves --ref
          # testing at acceptance time, so the build's contract job asserts
          # the two SHAs agree; a mismatch means testing moved between this
          # capture and the dispatch, and the run fails loudly instead of
          # silently building a different tree (#371).
          TARGET_SHA="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/git/ref/heads/testing" \
              --jq '.object.sha')"
          echo "Dispatching build.yml against testing@$TARGET_SHA"
          DISPATCH_SHA="$(gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
              -f "target_sha=$TARGET_SHA" \
              --json 'workflow_runs[0].head_sha' --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")"
          if [ -n "$DISPATCH_SHA" ] && [ "$DISPATCH_SHA" != "$TARGET_SHA" ]; then
            echo "::error title=dispatch resolved a different SHA::captured $TARGET_SHA, dispatch resolved $DISPATCH_SHA. Another commit landed on testing between the two reads; the build's contract job will fail this run."
          fi
