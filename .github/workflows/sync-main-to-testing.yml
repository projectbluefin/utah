name: Sync main to testing

on:
  # Only a push that can change the image rebuilds it. Each testing build
  # promotes a new :testing digest, Renovate then repins that digest in
  # iso/raw/Containerfile (#1547, #1553, #1556), and the E2E refreshes the
  # README's verified-ISO link (#1555, #1558): when those pushes rebuilt the
  # image, every build queued the next one, and Post-Testing E2E replaced its
  # pending run so often that :testing stopped moving (2026-11-25). The
  # nightly schedule below still syncs everything. Later patterns win.
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
      - 'docs/agent/**'
      - '!site/**'
      - '!baselines/**'
      - '!tests/**'
      - '!iso/raw/**'
      # the raw-medium track's two workflows (iso/raw)
      - '!.github/workflows/*-installer.yml'
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
    permissions:
      contents: write

  build:
    needs: sync
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      # Dispatch against the testing ref and pass its current full SHA. build.yml
      # rejects an input that differs from the run's github.sha before any publisher
      # runs, so a branch race fails closed instead of publishing a different tree.
      - name: Start the testing build explicitly after token-authenticated sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHA="$(gh api "repos/$REPOSITORY/commits/testing" --jq .sha)"
          test -n "$SHA"
          gh workflow run build.yml --repo "$REPOSITORY" --ref testing \
            -f sha="$SHA"
