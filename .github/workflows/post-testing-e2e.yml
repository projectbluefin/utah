name: Post-Testing E2E

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Utah run on testing to validate
        required: true
        type: string

permissions: {}

concurrency:
  group: utah-iso-e2e
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      main_ref: ${{ steps.inputs.outputs.main_ref }}
      sha: ${{ steps.inputs.outputs.sha }}
      run: ${{ steps.inputs.outputs.run }}
      digests: ${{ steps.inputs.outputs.digests }}
      suites: ${{ steps.inputs.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 10
        with:
          persist-credentials: false
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          # The dispatch job is the source run's last job. Wait for its final
          # conclusion before accepting artifacts; never resolve a partial run.
          timeout 300 gh run watch "$BUILD_RUN" --repo "$REPOSITORY" --exit-status --interval 10
          gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          gh run download "$BUILD_RUN" --repo "$REPOSITORY" \
            --pattern 'image-digest-testing-*' --dir digests
          matrix=$(python3 scripts/resolve-e2e-inputs.py run.json digests "$REPOSITORY")
          # The tacklebox live ISO builds the main flavor only (utah); the
          # kernel flavors are covered by the gnome-setup job. Resolve that one
          # ref here so tacklebox-iso stays a single build, not a matrix.
          main_ref=$(python3 -c "import json,sys; m=json.load(sys.stdin); print(next(x['ref'] for x in m['include'] if x['image']=='utah'))" <<<"$matrix")
          digests=$(jq -c 'reduce .include[] as $i ({}; . + {($i.image): $i.ref})' <<< "$matrix")
          suites_json=$(python3 scripts/flavors.py suites)
          missing=$(jq -r --argjson d "$digests" \
            '[.[] | .image | select(($d[.]) == null or ($d[.] | length) == 0)]
            | (if length == 0 then "" else ": \(join(", "))" end)' \
            <<< "$suites_json")
          if [ -n "$missing" ]; then
            echo "::warning::testsuite: missing published exact-digest for flavor(s)$missing"
          fi
          {
            echo "matrix=$matrix"
            echo "main_ref=$main_ref"
            echo "sha=$(jq -r .head_sha run.json)"
            echo "run=$BUILD_RUN"
            echo "digests=$digests"
            echo "suites=$suites_json"
          } >> "$GITHUB_OUTPUT"


  # Before the privileged gnome-setup and tacklebox-iso jobs pull the new image, prove
  # its SLSA provenance was produced by the reusable build workflow in
  # projectbluefin/actions on utah/testing (utah#1018). The promotion release
  # gate checks the cosign signature's identity; this checks the provenance
  # attestation itself, so an image attested by any other workflow or repo -- or
  # forged under this identity -- is rejected before those privileged jobs
  # touch it. Gate gnome-setup and tacklebox-iso on it so the check must
  # pass first.
  # (testsuite pulls the same digests without waiting on this job by design;
  # it runs unprivileged in its own VM. It still gates :testing promotion:
  # promote-to-testing needs it, #1329.)
  verify-provenance:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Verify the image's SLSA provenance
        env:
          IMAGE_REF: ${{ matrix.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash iso/scripts/verify-image-provenance.sh "$IMAGE_REF" 2>&1 | tee evidence/provenance.log
  # The install gate (#1569): the gnome-setup medium (iso/raw, ADR-0001) built
  # from the exact digest each flavor tests, then live boot, GUI install into
  # LUKS2, first boot, gnome-initial-setup, bootc switch and rollback. It
  # replaced the fisherman luks, lifecycle and production-iso jobs.
  gnome-setup:
    name: gnome-setup (${{ matrix.image }})
    needs: [resolve, verify-provenance]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image-installer.yml
    with:
      image_ref: ${{ matrix.ref }}

  # Build the main image with tuna-os/tacklebox and prove the live-boot path:
  # the ISO comes up and the UTAH_LIVE_READY marker appears on serial (#229).
  # build-iso-tacklebox.sh runs two stages: a rootless Flatpak bake (bwrap
  # needs the userns that tacklebox's rootful customize containers lack),
  # then root assembly with configure-live.sh as the live_customize script.
  # This is a DEBUG=1 build (test sshd/password), so unlike the luks job's
  # production ISO the ISO itself is never uploaded -- diagnostics only.
  tacklebox-iso:
    needs: [resolve, verify-provenance]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Prepare ISO and QEMU host
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            squashfs-tools xorriso dosfstools mtools qemu-system-x86 qemu-utils \
            ovmf
          # Same KVM grant as luks and lifecycle: the job user cannot open
          # /dev/kvm by default, and without it the boot gate fell back to TCG.
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p evidence
          df -h .
      - name: Build the ISO with tacklebox
        env:
          MAIN_REF: ${{ needs.resolve.outputs.main_ref }}
        run: |
          set -euo pipefail
          digest="${MAIN_REF##*@}"
          [[ "$digest" == sha256:* ]] || { echo "main_ref is not a digest: $MAIN_REF" >&2; exit 1; }
          sudo bash iso/scripts/build-iso-tacklebox.sh main testing ghcr "$digest" 1 \
            2>&1 | tee evidence/tbx-build.log
      - name: Verify the ISO with tacklebox
        timeout-minutes: 20
        run: |
          set -euo pipefail
          tacklebox_image=$(< config/tacklebox-image)
          [[ "$tacklebox_image" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]] || exit 1
          # Verify the builder image's SLSA provenance before running it
          # privileged (utah#918).
          sudo TACKLEBOX_IMAGE="$tacklebox_image" bash iso/scripts/verify-tacklebox-attestation.sh
          sudo podman pull "$tacklebox_image"
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /dev:/dev -v "$PWD/output:/out:ro" "$tacklebox_image" \
            verify /out/utah-main-tacklebox.iso 2>&1 | tee evidence/tbx-verify.log
      - name: Check the ISO is within the size budget
        run: |
          set -euo pipefail
          # The live ISO must stay under the budget (#128): the embedded image,
          # the Flatpaks, and the bootc-installer bundle all live inside it.
          size_bytes=$(stat -c %s output/utah-main-tacklebox.iso)
          limit=$((8 * 1024 * 1024 * 1024))
          echo "utah-main-tacklebox.iso is $size_bytes bytes"
          test "$size_bytes" -le "$limit" || { echo "ISO exceeds the size budget" >&2; exit 1; }
      # Under KVM the live session reaches the marker in well under a minute
      # (the luks job's live boot: ~35 s); the gate returns as soon as it does.
      - name: Live-boot and observe the UTAH_LIVE_READY marker
        env:
          UTAH_ISO_BOOT_TIMEOUT: 600
          UTAH_ISO_BOOT_WORK: ${{ runner.temp }}/utah-tbx-boot
        run: |
          set -euo pipefail
          bash iso/scripts/tacklebox-boot-gate.sh "$PWD/output/utah-main-tacklebox.iso" UTAH_LIVE_READY \
            2>&1 | tee evidence/tbx-boot.log
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tacklebox-iso-diagnostics-utah
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/
            ${{ runner.temp }}/utah-tbx-boot/serial.log

  # Run the testsuite against each exact built digest, in parallel with the
  # ISO jobs. It surfaces scenario results and desktop screenshots for every
  # flavor, and it gates promotion: promote-to-testing needs it, so a red leg
  # leaves :testing where it is and records no E2E evidence (#1329).
  testsuite:
    needs: resolve
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.suites) }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@37346780cb31073d5f387d8aa420fd78ae64939c # v1
    with:
      image: ${{ fromJSON(needs.resolve.outputs.digests)[matrix.image] }}
      compose_image: false
      suites: ${{ matrix.suites }}
      test_repository: projectbluefin/testsuite
      # The tests checked out must be the commit the e2e.yml above comes from,
      # or workflow and tests drift apart (#946). Renovate bumps both together.
      test_ref: 37346780cb31073d5f387d8aa420fd78ae64939c # v1

  # :testing is a ratchet over commits, not a mirror of the branch tip. The
  # tested digests become :testing when their commit is the promoted commit or
  # a descendant of it, however far main has moved meanwhile; an older commit,
  # or a diverged one that is not strictly newer, refuses so nothing ever moves
  # :testing backwards. See scripts/promotion-ratchet.py.
  #
  # This job is the only writer of :testing. The workflow-level concurrency
  # group (utah-iso-e2e, cancel-in-progress: false) runs one E2E at a time, so
  # two promotions never interleave.
  #
  # Only a run from main writes anything: the release gate trusts the commit
  # statuses recorded here, and a dispatch from another ref runs another
  # branch's copy of this file. Such a run still tests; it just cannot publish
  # evidence or move a tag.
  #
  # Every E2E job must pass first, the testsuite matrix included (#1329): a red
  # or skipped leg skips this job, so no evidence is recorded and no tag moves.
  # There is no override; fix or scope the failing scenario upstream instead.
  promote-to-testing:
    needs: [resolve, gnome-setup, testsuite]
    # Every flavor's gnome-setup install and the whole testsuite matrix must
    # pass (#1329, #1569).
    if: >-
      ${{ !cancelled()
      && needs.resolve.result == 'success'
      && needs.gnome-setup.result == 'success'
      && needs.testsuite.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - name: Explain why nothing is published
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::warning::Not running from main (${GITHUB_REF}); E2E evidence is kept, but no status is recorded and no tag moves."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 10
        if: github.ref == 'refs/heads/main'
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        timeout-minutes: 15
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Recorded before the ratchet decides, because it is true whatever the
      # ratchet says: this exact digest passed the gnome-setup install and the
      # testsuite. The release gate reads it back per digest and per commit.
      - name: Record E2E evidence for the tested digests
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/promotion-ratchet.py record
      - name: Decide whether the tested commit may advance :testing
        id: ratchet
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: python3 scripts/promotion-ratchet.py decide
      - name: Move :testing to the tested digests
        if: github.ref == 'refs/heads/main' && steps.ratchet.outputs.action == 'promote'
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          # Sequential, not atomic. A failure part-way leaves some flavors on
          # the new commit; rerunning this job (or the next descendant E2E)
          # completes it, because the ratchet accepts the same commit for any
          # flavor still behind it.
          while IFS= read -r ref; do
            skopeo copy --all --preserve-digests "docker://$ref" "docker://${ref%@*}:testing"
          done < <(jq -r '.include[].ref' <<< "$MATRIX")

  documentation:
    needs: [resolve, gnome-setup]
    if: >-
      ${{ !cancelled()
      && needs.resolve.result == 'success'
      && needs.gnome-setup.result == 'success' }}
    runs-on: ubuntu-26.04
    # The workflow token still pushes the `verification` record branch. The
    # README pull request is opened with the mergeraptor App token below, so
    # its normal pull_request checks run and the hive treats it as a trusted
    # bot PR; a PR opened with the workflow token gets no checks of its own.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 10
        with:
          ref: main
      - name: Download the passing main-flavor install record
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-installer-utah
          path: ${{ runner.temp }}/gnome-setup
      # The record: every stage's screenshot and the provenance of this run.
      - name: Assemble the verification record
        env:
          SRC: ${{ runner.temp }}/gnome-setup
          RECORD: ${{ runner.temp }}/verification
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_REF: ${{ fromJSON(needs.resolve.outputs.digests)['utah'] }}
        run: |
          set -euo pipefail
          mkdir -p "$RECORD"
          cp -a "$SRC/e2e/screenshots" "$RECORD/screenshots"
          [[ -d "$SRC/e2e/evidence" ]] && cp -a "$SRC/e2e/evidence" "$RECORD/evidence"
          jq -n --arg sha "$SOURCE_SHA" --arg run "$GITHUB_RUN_ID" --arg image "$IMAGE_REF" \
            '{source_sha: $sha, e2e_run: $run, image: $image, installer: "gnome-setup"}' > "$RECORD/provenance.json"
      # The record lives on a single-commit orphan branch, force-pushed each
      # time, so screenshots never accumulate in main's history.
      - name: Publish the verification record branch
        id: publish
        env:
          RECORD: ${{ runner.temp }}/verification
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test -f "$RECORD/screenshots/14-first-boot-desktop.png"
          git worktree add --orphan -b verification "$RUNNER_TEMP/record"
          cp -a "$RECORD/." "$RUNNER_TEMP/record/"
          git -C "$RUNNER_TEMP/record" add -A
          git -C "$RUNNER_TEMP/record" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "verification record for ${SOURCE_SHA}"
          git -C "$RUNNER_TEMP/record" push --force origin HEAD:refs/heads/verification
          # The record is a single-commit orphan; capture its exact commit so the
          # README evidence links pin to it instead of the mutable `verification`
          # branch, which always resolves to the latest force-push.
          echo "record_commit=$(git -C "$RUNNER_TEMP/record" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh README evidence link
        env:
          RECORD: ${{ runner.temp }}/verification
          RECORD_COMMIT: ${{ steps.publish.outputs.record_commit }}
        run: python3 scripts/update-e2e-readme.py "$RECORD"
      # Only trusted main may mint the App token and open the PR; a dispatch
      # on any other ref publishes the record branch but proposes nothing.
      - name: Get repository-scoped mergeraptor token
        if: github.repository_owner == 'projectbluefin' && github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose updated verification link
        if: github.repository_owner == 'projectbluefin' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/iso-verification
          title: 'docs: refresh verified ISO record link'
          commit-message: 'docs: refresh verified ISO record link'
          body: |
            The gnome-setup install passed for every configured flavor. Screenshots and provenance were published to the `verification` branch.
            Source commit: ${{ needs.resolve.outputs.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ needs.resolve.outputs.run }}
            ISO E2E: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            README.md
