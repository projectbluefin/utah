name: Post-Testing E2E

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Utah run on testing to validate
        required: true
        type: string

permissions: {}

concurrency:
  group: utah-iso-e2e
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      main_ref: ${{ steps.inputs.outputs.main_ref }}
      sha: ${{ steps.inputs.outputs.sha }}
      run: ${{ steps.inputs.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          # The dispatch job is the source run's last job. Wait for its final
          # conclusion before accepting artifacts; never resolve a partial run.
          timeout 300 gh run watch "$BUILD_RUN" --repo "$REPOSITORY" --exit-status --interval 10
          gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          gh run download "$BUILD_RUN" --repo "$REPOSITORY" \
            --pattern 'image-digest-testing-*' --dir digests
          matrix=$(python3 scripts/resolve-e2e-inputs.py run.json digests "$REPOSITORY")
          # The tacklebox live ISO builds the main flavor only (utah); the
          # kernel flavors are covered by the luks job above. Resolve that one
          # ref here so tacklebox-iso stays a single build, not a matrix.
          main_ref=$(python3 -c "import json,sys; m=json.load(sys.stdin); print(next(x['ref'] for x in m['include'] if x['image']=='utah'))" <<<"$matrix")
          {
            echo "matrix=$matrix"
            echo "main_ref=$main_ref"
            echo "sha=$(jq -r .head_sha run.json)"
            echo "run=$BUILD_RUN"
          } >> "$GITHUB_OUTPUT"

  luks:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Prepare ISO and QEMU host
        run: |
          set -euo pipefail
          # These hosted-runner SDKs are unused by ISO composition.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            squashfs-tools xorriso dosfstools mtools qemu-system-x86 qemu-utils \
            ovmf sshpass ffmpeg tesseract-ocr
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p output evidence
          df -h .
      - name: Pull exact published payload
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman pull "$IMAGE_REF"
          podman logout ghcr.io
      - name: Compose disposable debug ISO
        env:
          IMAGE_REF: ${{ matrix.ref }}
          UTAH_ISO_WORKDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bash iso/scripts/build-iso.sh "$IMAGE_REF" "$PWD/output/utah-live.iso" \
            "Utah CI Live" 1 "$IMAGE_REF" 2>&1 | tee evidence/iso-build.log
      - name: Run existing LUKS install and desktop test
        env:
          IMAGE_REF: ${{ matrix.ref }}
          UTAH_E2E_WORK: ${{ runner.temp }}/utah-luks-e2e
          UTAH_E2E_REQUIRE_SCREENSHOTS: "1"
          UTAH_E2E_REQUIRE_FASTFETCH: "1"
          UTAH_E2E_RAM: "6144"
          UTAH_E2E_CPUS: "2"
        run: |
          set -euo pipefail
          bash iso/scripts/luks-e2e.sh "$PWD/output/utah-live.iso" "$IMAGE_REF" \
            2>&1 | tee evidence/luks-test.log
      - name: Record exact test provenance
        env:
          IMAGE_REF: ${{ matrix.ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          BUILD_RUN: ${{ needs.resolve.outputs.run }}
        run: |
          set -euo pipefail
          sha256sum output/utah-live.iso > evidence/iso.sha256
          jq -n --arg image "$IMAGE_REF" --arg sha "$SOURCE_SHA" \
            --arg build "$BUILD_RUN" --arg run "$GITHUB_RUN_ID" \
            '{image:$image,source_sha:$sha,build_run:$build,e2e_run:$run}' \
            > docs/verification/provenance.json
          cp evidence/iso.sha256 docs/verification/
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iso-diagnostics-${{ matrix.image }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/
            ${{ runner.temp }}/utah-luks-e2e/*.log
            ${{ runner.temp }}/utah-luks-e2e/fastfetch-ocr.txt
            ${{ runner.temp }}/utah-luks-e2e/screenshots/
      - name: Preserve passing verification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iso-verified-${{ matrix.image }}
          if-no-files-found: error
          retention-days: 30
          path: docs/verification/
      # Never upload debug ISOs or test disks: they contain test passwords.

  # Build the main image with tuna-os/tacklebox and prove the live-boot path:
  # the ISO comes up and the UTAH_LIVE_READY marker appears on serial (#229).
  # build-iso-tacklebox.sh runs two stages: a rootless Flatpak bake (bwrap
  # needs the userns that tacklebox's rootful customize containers lack),
  # then root assembly with configure-live.sh as the live_customize script.
  # This is a DEBUG=1 build (test sshd/password), so unlike production-iso
  # below the ISO itself is never uploaded -- diagnostics only.
  tacklebox-iso:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Prepare ISO and QEMU host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            squashfs-tools xorriso dosfstools mtools qemu-system-x86 qemu-utils \
            ovmf
          mkdir -p evidence
          df -h .
      - name: Build the ISO with tacklebox
        env:
          MAIN_REF: ${{ needs.resolve.outputs.main_ref }}
        run: |
          set -euo pipefail
          digest="${MAIN_REF##*@}"
          [[ "$digest" == sha256:* ]] || { echo "main_ref is not a digest: $MAIN_REF" >&2; exit 1; }
          sudo bash iso/scripts/build-iso-tacklebox.sh main testing ghcr "$digest" 1 \
            2>&1 | tee evidence/tbx-build.log
      - name: Verify the ISO with tacklebox
        run: |
          set -euo pipefail
          sudo podman pull ghcr.io/tuna-os/tacklebox:latest
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /dev:/dev -v "$PWD/output:/out:ro" ghcr.io/tuna-os/tacklebox:latest \
            verify /out/utah-main-tacklebox.iso 2>&1 | tee evidence/tbx-verify.log
      - name: Check the ISO is within the size budget
        run: |
          set -euo pipefail
          # The live ISO must stay under the budget (#128): the embedded image,
          # the Flatpaks, and the bootc-installer bundle all live inside it.
          size_bytes=$(stat -c %s output/utah-main-tacklebox.iso)
          limit=$((6 * 1024 * 1024 * 1024))
          echo "utah-main-tacklebox.iso is $size_bytes bytes"
          test "$size_bytes" -le "$limit" || { echo "ISO exceeds the size budget" >&2; exit 1; }
      - name: Live-boot and observe the UTAH_LIVE_READY marker
        env:
          UTAH_ISO_BOOT_TIMEOUT: 1800
        run: |
          set -euo pipefail
          # No KVM on GitHub-hosted runners: the gate falls back to TCG.
          bash iso/scripts/tacklebox-boot-gate.sh "$PWD/output/utah-main-tacklebox.iso" UTAH_LIVE_READY \
            2>&1 | tee evidence/tbx-boot.log
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tacklebox-iso-diagnostics-utah
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/

  # Test credentials are only present in the DEBUG=1 ISO above. Build this
  # artifact after the whole matrix passes, so a retained ISO is production
  # media and every configured image has completed its offline-install gate.
  production-iso:
    needs: [resolve, luks]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Prepare production ISO host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            squashfs-tools xorriso dosfstools mtools
          mkdir -p output
          df -h .
      - name: Pull exact published payload
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman pull "$IMAGE_REF"
          podman logout ghcr.io
      - name: Compose production ISO and checksum
        env:
          IMAGE_REF: ${{ matrix.ref }}
          UTAH_ISO_WORKDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bash iso/scripts/build-iso.sh "$IMAGE_REF" "$PWD/output/utah-live.iso" \
            "Utah Live" 0 "$IMAGE_REF"
          (cd output && sha256sum utah-live.iso > utah-live.iso.sha256)
      # "production" is the DEBUG=0 build, not shippable media. DEBUG=0 keeps
      # the test credentials and sshd path out (iso/live/src/configure-live.sh),
      # so nothing secret is retained -- but build-iso.sh applies
      # `enforcing=0 console=ttyS0,115200n8` for every DEBUG value, so this
      # boots SELinux-permissive. Whether the live environment ships that way
      # is a product decision tracked in #186 alongside signing and Secure
      # Boot; a green job here is not evidence the media is release-ready.
      # Multi-GB per flavor per dispatch at 30 days: revisit the window before
      # widening the matrix.
      - name: Retain production ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-iso-${{ matrix.image }}
          retention-days: 30
          if-no-files-found: error
          path: |
            output/utah-live.iso
            output/utah-live.iso.sha256

  promote-to-testing:
    needs: [resolve, luks, production-iso]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promote only the tested digests if still current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/commits/testing" --jq .sha)
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "Superseded build: retaining evidence without moving tags."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y skopeo
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while IFS= read -r ref; do
            skopeo copy --all --preserve-digests "docker://$ref" "docker://${ref%@*}:testing"
          done < <(jq -r '.include[].ref' <<< "$MATRIX")

  documentation:
    needs: [resolve, luks, production-iso]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Download passing main-desktop screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: iso-verified-utah
          path: docs/verification
      - name: Refresh README evidence link
        run: python3 scripts/update-e2e-readme.py
      - name: Propose updated verification record
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/iso-verification
          title: 'docs: refresh verified ISO screenshots'
          commit-message: 'docs: refresh verified ISO screenshots'
          body: |
            Screenshots from the existing LUKS ISO test, after every configured flavor passed.
            Source commit: ${{ needs.resolve.outputs.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ needs.resolve.outputs.run }}
            ISO E2E: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Exact image reference and ISO checksum are in docs/verification/.
          add-paths: |
            README.md
            docs/verification/
