# Utah's package overlay on top of the Bluefin package contract.
#
# packages/bluefin.toml is a byte-for-byte copy of projectbluefin/bluefin's
# build_files/packages/base.toml and must stay that way -- it is the parity
# contract, and any drift there is a parity bug.  Everything Utah needs *in
# addition to* (or *instead of*) that contract lives here.
#
# Sections:
#   [gnome]        GNOME 51 desktop contract Hummingbird does not ship
#   [hardware]     firmware and microcode the bootable base leaves out
#   [parity]       what Bluefin gets from Fedora's base image and Hummingbird has
#   [build]        toolchain needed to build the pinned GNOME extensions
#   [unavailable]  Bluefin contract packages none of Utah's repositories provide
#
# On [multimedia_overrides], which Utah deliberately does not install:
#
#   Those twelve entries -- mesa-libGL, mesa-vulkan-drivers, libva,
#   intel-mediasdk, libheif and friends -- are not extra packages. They are the
#   same package names Fedora already ships, which Bluefin *replaces* with
#   negativo17 builds by enabling fedora-multimedia. Utah does not enable that
#   repository, so it installs Fedora's builds of those names instead. Nothing
#   is missing from the image; what differs is which build of them it carries,
#   and the practical consequence is hardware-accelerated codec support.
#
#   This is why they are absent from the contract rather than listed under
#   [unavailable]: [unavailable] means "no source provides this name at all",
#   which is false of these. Recording them as missing would be wrong, and
#   recording them as satisfied would hide a real functional difference from
#   Bluefin.
#
#   The factory is already building several of them for Hummingbird --
#   intel-gmmlib, intel-mediasdk, intel-vpl-gpu-rt, libheif and libva all built
#   in projectbluefin/hummingbird-github. When that overlay is published and enabled
#   here, it becomes the source that negativo17 is for Bluefin, and these can
#   move into the contract as a version assertion rather than a name one.

[gnome]
# Hummingbird supplies the bootable base but not a desktop.  The pinned
# utah-packages repository supplies the complete GNOME 51 dependency graph.
packages = [
    "gnome-control-center",
    "gnome-session",
    "gnome-settings-daemon",
    "gnome-shell",
    "gsettings-desktop-schemas",
    "gtk4",
    "libadwaita",
    "mutter",
    "xdg-desktop-portal",
    "xdg-desktop-portal-gnome",
    # Locale data. Hummingbird's base carries only glibc-minimal-langpack,
    # which provides C and C.UTF-8 and nothing else, so any LANG or LC_*
    # value a user sets -- through gnome-control-center, localectl, or a
    # /etc/locale.conf carried over from another install -- names a locale
    # that does not exist. Every setlocale() then warns, on every command
    # (#114). /etc/profile.d/lang.sh is meant to fall back to C.UTF-8 but
    # its reset is clobbered by its own locale.conf re-export, so the noise
    # is unrecoverable from inside the image. Bluefin's Silverblue base
    # ships glibc-all-langpacks; matching it is what makes Region & Language
    # a working control rather than a way to break the terminal.
    "glibc-all-langpacks",
]

[parity]
# Packages Bluefin's image carries without naming them in bluefin.toml, because
# Fedora's Silverblue base supplies them, and which Hummingbird's repository
# has but its server-shaped bootable base leaves out. Measured, not guessed:
# the image-level parity report (#117, scripts/check-image-parity.py) listed
# 277 such names against public-hummingbird-x86_64-rpms. CI's "Check package
# availability" step resolves the real transaction against the pinned images,
# and is the gate on every name here; a first-level Requires check is not
# enough, as the three ModemManager-shaped exclusions below proved.
# Aligned with Dakota where it ships the same piece: the connectivity check,
# ALSA use-case profiles, the language pack and the core font set.
#
# Left out, with the dependency the pinned repositories do not carry:
#   NetworkManager-wwan        requires ModemManager, whose factory build
#                              needs libmbim, libqmi and libqrtr-glib that
#                              nothing provides -- a factory gap
#   NetworkManager-bluetooth   requires libnm-wwan.so from the wwan plugin,
#                              so it falls with it
#   poppler-utils              Hummingbird's poppler requires poppler-data,
#                              which Hummingbird does not ship
#   cups, cups-client          need cups-filters (utah-packages#144)
#   vim-enhanced               needs libgpm.so.2 (vim-minimal is in the base)
#   default-fonts-core-emoji   needs google-noto-emoji-color-fonts
#   default-fonts-core-math    needs stix-fonts (both utah-packages#147)
#   fprintd, fprintd-pam       in no repository (utah-packages#145)
#   alsa-utils                 in no repository (utah-packages#146)
#
# NetworkManager-wifi is deliberately not here yet: its supplicant and the
# regulatory database are being built by utah-packages#133, and it joins this
# list when the factory image that carries them is pinned (#126).
#
# unzip is also in [build]; it is listed here because configure-services.sh
# removes the build tooling after the extension build, and Bluefin ships
# unzip to users. The removal line skips it for that reason.
packages = [
    # Networking
    "NetworkManager-config-connectivity-fedora",
    "bind-utils",
    "iptables-nft",
    # Audio
    "alsa-ucm",
    # Locale and fonts
    "langpacks-en",
    "langpacks-fonts-en",
    "abattis-cantarell-fonts",
    "default-fonts-core-sans",
    "default-fonts-core-serif",
    "default-fonts-core-mono",
    "google-noto-sans-mono-vf-fonts",
    "google-noto-serif-vf-fonts",
    "google-noto-sans-symbols-2-fonts",
    "google-noto-sans-math-fonts",
    # Shell and tooling Bluefin users reach for
    "bash-completion",
    "man-db",
    "less",
    "which",
    "file",
    "hostname",
    "xxd",
    "unzip",
    "zip",
    "dbus-tools",
    "keyutils",
    "crypto-policies-scripts",
    "python3-pip",
    "systemd-container",
]

[hardware]
# Firmware for real machines. Neither of these is in the Bluefin contract,
# for the same reason the [services] entries below are not: Fedora's base
# image carries them, so Bluefin never has to ask, while Hummingbird's
# bootable base ships effectively no device firmware at all.
#
# On hardware that needs a blob this is not cosmetic. Reported on a ThinkPad
# X230 (#97) as a dead Centrino Advanced-N 6205:
#
#     iwlwifi 0000:03:00.0: Direct firmware load for iwlwifi-6000g2a-6.ucode
#       failed with error -2
#     iwlwifi 0000:03:00.0: no suitable firmware found
#
# with no iwlwifi blob anywhere under /usr/lib/firmware on the deployed image
# and no linux-firmware in its rpmdb, against ~192 firmware files on Bluefin
# on the same machine. A laptop with no wireless has no way to fetch the fix,
# which is what makes this the sharpest of the parity gaps.
#
# linux-firmware alone is NOT enough, which is the trap in this issue.  It is
# a split package here: it Requires only linux-firmware-whence, and it
# Recommends thirteen device packages -- amd-gpu, atheros, brcmfmac, cirrus,
# intel-gpu, mt7xxx, nvidia-gpu, nxpwireless, qcom-wwan, realtek, tiwilink and
# friends -- which weak dependencies bring in for free.  Intel wireless is in
# neither list.  Measured against the pinned repository's filelists,
# iwlwifi-6000g2a-6.ucode -- the exact blob #97 names -- ships in
# iwlwifi-dvm-firmware, so installing linux-firmware and stopping there would
# have closed the issue while leaving the X230 just as dead.
#
# So the three iwlwifi generations and iwlegacy are named explicitly, which
# covers Intel wireless from the 3945 era through current parts.  Everything
# else arrives through the recommends above.
#
# microcode_ctl is deliberately absent: it exists in neither enabled
# repository -- not in the pinned factory image, not in
# public-hummingbird-x86_64-rpms -- so naming it here would fail the install
# transaction outright.  CPU errata updates therefore remain a real gap on
# this base, and closing it needs a factory recipe first.
packages = [
    "linux-firmware",
    "iwlwifi-dvm-firmware",
    "iwlwifi-mvm-firmware",
    "iwlwifi-mld-firmware",
    "iwlegacy-firmware",
]

[build]
# Build dependencies for scripts/build-gnome-extensions.sh.
#
# cmake is deliberately absent, though Bluefin lists it. Every cmake in the
# Hummingbird repository -- 4.3.0-2.1.hum1 through 4.3.0-5.1.hum1 -- requires
# libjsoncpp.so.26, and the only jsoncpp there provides libjsoncpp.so.27, so
# cmake cannot be installed from Hummingbird at all. It is a missed rebuild on
# their side after the jsoncpp bump, not a gap this image has to answer for,
# and nothing in build-gnome-extensions.sh invokes cmake: it runs make, meson,
# unzip and glib-compile-schemas. Restore this entry once Hummingbird rebuilds
# cmake, or if an extension ever needs it.
packages = [
    "dbus-devel",
    "glib2-devel",
    "meson",
    "sassc",
    "unzip",
]

[services]
# Bluefin's desktop image adds these to the server base before 40-services.sh
# enables their units. uupd is downloaded separately because it is published
# as a release binary rather than an RPM in the Hummingbird repositories.
#
# systemd-resolved and flatpak are not in the Bluefin contract because Fedora's
# base image already carries them. Hummingbird's bootable base does not.
# systemd-resolved exists in their repository but is not installed, so the
# image had no resolver and configure-services stopped on a unit file that was
# never there. flatpak is not in their repository at all -- the factory builds
# it now -- and without it the image declares a Flatpak contract it has no way
# to install, and the live ISO build stops at "flatpak: command not found".
#
# cryptsetup is the same shape again: Hummingbird ships cryptsetup-libs but not
# the tool, so the installer could not create an encrypted volume --
#   fisherman: fatal: missing required host tool: "cryptsetup" not found
# -- and an installed system whose disk is encrypted could not manage its own
# keys. The initramfs already carries the crypt and systemd-cryptsetup dracut
# modules, so unlocking was never the gap; creating the volume was.
packages = [
    "cryptsetup",
    "flatpak",
    "fwupd",
    "systemd-resolved",
    "tailscale",
]

[unavailable]
# Packages Bluefin ships that none of Utah's repositories provide.  Each entry
# MUST carry a tracking issue: this list is the documented parity debt, not a
# dumping ground for packages that are merely inconvenient.
#
# evolution-ews-core
#   The Exchange Web Services plugin for Evolution (fedora_v43 section of
#   the Bluefin manifest). Building it requires the entire
#   evolution-data-server stack -- camel, evolution-mail, evolution-shell,
#   libebook, libecal, libedata-book -- which the factory does not yet build.
#   Disproportionate cost for one Exchange plugin binary; the EDS closure can
#   be added to the factory if Exchange support is ever required.
#
# fish
#   Fedora's fish spec uses %cargo_generate_buildrequires, which requires
#   every Rust crate as a system RPM (rust-anstyle, rust-clap, ...). Fedora
#   44 does not ship Rust crate binary packages -- they exist only in
#   Rawhide -- so the buildroot cannot satisfy them. Building fish needs a
#   vendored/cargo-fetch rebuild of the spec rather than the system-crate
#   model.
#
# zsh
#   The HTML docs build target pulls texi2html, which drags Fedora's ruby
#   (ruby-default-gems) into a buildroot that already carries Hummingbird's
#   ruby4.0. The two conflict on file paths, so the transaction fails. Needs
#   either a ruby exclusion in the buildroot or dropping the html subpackage.
#
# firefox
#   Utah installs org.mozilla.firefox as a Flatpak through the desktop
#   contract. The RPM browser is deliberately excluded, while mozjs140 is
#   retained for GNOME Shell. Tracked by #35 and utah-packages#112.
#
# anaconda-live, slitherer
#   Utah's ISO uses bootc-installer. Both alternative installer packages need
#   anaconda-webui, which the factory excludes because Cockpit authentication
#   needs a working GHmac backend in Hummingbird's GLib. Slitherer also lacks
#   its Qt WebEngine dependency closure. Match the factory's installer policy
#   until that path is supported; tracked by #83.
#
# avahi
#   Hummingbird ships avahi-libs and avahi-glib but not the daemon, so
#   geoclue retries forever against nobody (#104). The daemon package does
#   exist in their repository, but it is not installable here: avahi
#   0.9~rc4-0.1.1.hum1 needs libdaemon.so.0 and libdaemon >= 0.11, and
#   libdaemon is in no repository this image enables -- not Hummingbird, not
#   the pinned factory image, and not the factory inventory either. A
#   libdaemon recipe has to come first. Tracked by #104.
#
# nautilus
#   The accessories ship orphaned -- nautilus-extensions, nautilus-python and
#   nautilus-gsconnect installed with no /usr/bin/nautilus (#100). The recipe
#   is not the gap: nautilus 51~beta-1.hum1.bfin is in the pinned factory
#   repository already. Its dependency closure is. It needs
#   libgexiv2-0.16.so.4, libportal.so.1 and libportal-gtk4.so.1, and gexiv2
#   and libportal are in no repository this image enables and in no factory
#   recipe -- including utah-packages#70's 340. gexiv2 additionally needs
#   exiv2, which is equally absent. Three recipes, not one. Tracked by #100.
#
# libgda, libgda-sqlite
#   Upstream added both as runtime dependencies for the maintained Copyous
#   extension (bluefin#1210). Neither is in the pinned factory image or in
#   public-hummingbird-x86_64-rpms -- Hummingbird carries no package whose
#   name contains gda at all. One factory recipe would cover both, because
#   libgda-sqlite is a subpackage of the libgda SRPM rather than its own
#   source. Tracked by #106.
#
# ppp
#   In neither repository, and nothing in either Provides it. This one costs
#   more than dial-up: Hummingbird ships NetworkManager-ppp (1.58.0-1.hum1
#   and 1.58.1-1.hum1) whose metadata carries Requires: ppp, so that plugin
#   is uninstallable from their own repository and NetworkManager's PPPoE and
#   PPTP paths cannot be installed at all. The same shape as avahi (#104) and
#   nautilus (#100): a plugin shipped without the daemon behind it.
#   Tracked by #107.
#
# grub2-efi-x64-cdboot and pipewire-libs-extra are supplied by the pinned
# September 10 factory candidate and return to the install contract (#35).
packages = [
    "anaconda-live",
    "avahi",
    "evolution-ews-core",
    "firefox",
    "fish",
    "libgda",
    "libgda-sqlite",
    "nautilus",
    "ppp",
    "slitherer",
    "zsh",
]

# nvidia-container-toolkit was recorded here as a second gap. It is not one, and
# the reasoning that put it here was faulty: it came from UBlue's akmods bundle,
# that bundle is unusable on this base, and the conclusion drawn was that no
# source existed. The bundle was one source, not the only one.
#
# NVIDIA publishes the toolkit itself at
# https://nvidia.github.io/libnvidia-container/stable/rpm/$basearch -- a path
# with no distribution version in it, so unlike the akmods bundle it is not tied
# to a Fedora release or an exact kernel NEVR. Its dependencies are base OS
# libraries Hummingbird already has: glibc 2.17 symbols, libcap, libelf,
# libseccomp.so.2, libresolv, none of them version-pinned.
#
# So it is installed on the nvidia flavors from packages/nvidia-container.repo,
# and verify-rpm-contract.py asserts it by name. Container GPU access is not
# lost. The driver and its userspace still arrive as files from the .run payload
# rather than as RPMs, which is why only this one name is asserted.
#
# On CUDA, which was considered and deliberately not included.
#
# NVIDIA publishes a CUDA repository with a fedora44 directory, so it is
# available. Measured from its metadata rather than guessed: the cuda-toolkit
# closure is 65 packages, 3.97 GB to download and 7.68 GB installed. This image
# is a few GB, so that multiplies it, in every pull and every layer, and it has
# to survive an OCI export and a rechunk on a runner that already needed disk
# freed for the kernel build.
#
# The full `cuda` metapackage is worse and is not even installable here: it
# requires kmod-nvidia-open-dkms, nvidia-driver-libs, nvidia-driver-common and
# dkms, which are RPM names this image does not have, because the driver arrives
# from the .run payload as files.
#
# The right home for CUDA on an image like this is a container, which is exactly
# what the toolkit above makes possible: `podman run --device nvidia.com/gpu=all`
# against one of NVIDIA CUDA images gets the full toolkit with GPU access and
# nothing in the base image. That is a better answer than 7.68 GB of it baked in,
# so this stays out unless someone asks for it with that trade-off in view.
