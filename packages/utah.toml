# Utah's Rawhide overlay on top of the Bluefin package contract.
#
# packages/bluefin.toml is a byte-for-byte copy of projectbluefin/bluefin's
# build_files/packages/base.toml and must stay that way -- it is the parity
# contract, and any drift there is a parity bug.  Everything Utah needs *in
# addition to* (or *instead of*) that contract lives here.
#
# Sections:
#   [gnome]        GNOME 51 desktop contract Hummingbird does not ship
#   [firmware]     device firmware Bluefin inherits from its Fedora base
#   [build]        toolchain needed to build the pinned GNOME extensions
#   [unavailable]  Bluefin contract packages with no Fedora Rawhide source
#
# On [multimedia_overrides], which Utah deliberately does not install:
#
#   Those twelve entries -- mesa-libGL, mesa-vulkan-drivers, libva,
#   intel-mediasdk, libheif and friends -- are not extra packages. They are the
#   same package names Fedora already ships, which Bluefin *replaces* with
#   negativo17 builds by enabling fedora-multimedia. Utah does not enable that
#   repository, so it installs Fedora's builds of those names instead. Nothing
#   is missing from the image; what differs is which build of them it carries,
#   and the practical consequence is hardware-accelerated codec support.
#
#   This is why they are absent from the contract rather than listed under
#   [unavailable]: [unavailable] means "no source provides this name at all",
#   which is false of these. Recording them as missing would be wrong, and
#   recording them as satisfied would hide a real functional difference from
#   Bluefin.
#
#   The factory is already building several of them for Hummingbird --
#   intel-gmmlib, intel-mediasdk, intel-vpl-gpu-rt, libheif and libva all built
#   in projectbluefin/hummingbird-github. When that overlay is published and enabled
#   here, it becomes the source that negativo17 is for Bluefin, and these can
#   move into the contract as a version assertion rather than a name one.

[gnome]
# Hummingbird supplies the bootable base but not a desktop.  Fedora Rawhide
# supplies the complete GNOME 51 dependency graph.
packages = [
    "gnome-control-center",
    "gnome-session",
    "gnome-settings-daemon",
    "gnome-shell",
    "gsettings-desktop-schemas",
    "gtk4",
    "libadwaita",
    "mutter",
    "xdg-desktop-portal",
    "xdg-desktop-portal-gnome",
]

[firmware]
# Bluefin never names these: it inherits them from its Fedora base image, so
# they are absent from the parity contract in packages/bluefin.toml. Utah's
# base is Hummingbird's bootc-os, which ships the kernel and no firmware at
# all -- 262 packages, none of them linux-firmware -- and Hummingbird's
# repository has none either. Nothing Requires linux-firmware, so no
# resolution pulls it in and no gate noticed: the boot test runs under QEMU on
# virtio, which needs no firmware blobs. The result was an image that reaches
# GDM and cannot bring up any wifi adapter that loads a blob, which is nearly
# all of them, nor an AMD, Intel or NVIDIA GPU at full capability.
#
# This list is Bluefin's, read out of files/pkg-churn.json in
# projectbluefin/bluefin, which records what that image actually carries. That
# is the parity target, not "everything Fedora splits out of linux-firmware".
# Bluefin takes twenty-one of the thirty subpackages and leaves the datacenter
# NIC families -- liquidio, mlxsw_spectrum, mrvlprestera, netronome, qed -- and
# the Qualcomm SoC ones behind. Matching it rather than taking the lot saves
# about 350 MiB, most of that qcom-firmware at 148 MiB and
# mlxsw_spectrum-firmware at 102 MiB, neither of which an x86_64 desktop
# loads. Bluefin does keep qcom-wwan-firmware for modems and mt7xxx-firmware
# for MediaTek wireless while dropping the broader mediatek-firmware; that
# asymmetry is theirs, and it is copied rather than smoothed over.
#
# alsa-sof-firmware is the one entry that is not a linux-firmware subpackage.
# Sound Open Firmware is what a modern Intel laptop loads before it has audio
# at all. Dakota agrees strongly enough to give it its own BuildStream
# component, components/sof-firmware.bst, separate from linux-firmware.
#
# Dakota was read too. It curates at file level rather than by package -- 6,810
# files under components/linux-firmware.bst -- and its set is wider than
# Bluefin's, carrying qcom, netronome, mellanox and qed. Bluefin is the closer
# comparison for Utah and the contract this repository already tracks, so it
# is the one matched.
packages = [
    "alsa-sof-firmware",
    "amd-gpu-firmware",
    "amd-ucode-firmware",
    "atheros-firmware",
    "brcmfmac-firmware",
    "cirrus-audio-firmware",
    "intel-audio-firmware",
    "intel-gpu-firmware",
    "intel-vsc-firmware",
    "iwlegacy-firmware",
    "iwlwifi-dvm-firmware",
    "iwlwifi-mld-firmware",
    "iwlwifi-mvm-firmware",
    "libertas-firmware",
    "linux-firmware",
    "linux-firmware-whence",
    "mt7xxx-firmware",
    "nvidia-gpu-firmware",
    "nxpwireless-firmware",
    "qcom-wwan-firmware",
    "realtek-firmware",
    "tiwilink-firmware",
]

[build]
# Build dependencies for scripts/build-gnome-extensions.sh.
packages = [
    "cmake",
    "dbus-devel",
    "glib2-devel",
    "meson",
    "sassc",
    "unzip",
]

[services]
# Bluefin's desktop image adds these to the server base before 40-services.sh
# enables their units. uupd is downloaded separately because it is published
# as a release binary rather than an RPM in the Hummingbird repositories.
packages = [
    "fwupd",
    "tailscale",
]

[unavailable]
# Packages Bluefin ships that none of Utah's repositories provide.  Each entry
# MUST carry a tracking issue: this list is the documented parity debt, not a
# dumping ground for packages that are merely inconvenient.
#
# evolution-ews-core
#   The Exchange Web Services plugin for Evolution (fedora_v43 section of
#   the Bluefin manifest). Building it requires the entire
#   evolution-data-server stack -- camel, evolution-mail, evolution-shell,
#   libebook, libecal, libedata-book -- which the factory does not yet build.
#   Disproportionate cost for one Exchange plugin binary; the EDS closure can
#   be added to the factory if Exchange support is ever required.
#
# fish
#   Fedora's fish spec uses %cargo_generate_buildrequires, which requires
#   every Rust crate as a system RPM (rust-anstyle, rust-clap, ...). Fedora
#   44 does not ship Rust crate binary packages -- they exist only in
#   Rawhide -- so the buildroot cannot satisfy them. Building fish needs a
#   vendored/cargo-fetch rebuild of the spec rather than the system-crate
#   model.
#
# tailscale
#   tailscale 1.98.8's vendored go-json-experiment references json.SkipFunc,
#   added to the stdlib in Go 1.28. Hummingbird's newest Go is 1.27, so the
#   vendored tree cannot compile. Needs a version pin whose vendored deps
#   target Go 1.27, or a Go 1.28+ toolchain in the buildroot.
#
# zsh
#   The HTML docs build target pulls texi2html, which drags Fedora's ruby
#   (ruby-default-gems) into a buildroot that already carries Hummingbird's
#   ruby4.0. The two conflict on file paths, so the transaction fails. Needs
#   either a ruby exclusion in the buildroot or dropping the html subpackage.
#
# firefox, firefox-langpacks
#   Not a gap: a deliberate substitution, and the only entry here that is not
#   parity debt. The package factory used to build the RPM and stopped -- a
#   full PGO and LTO Gecko compile was the longest build it had and it
#   repeatedly hit the runner memory ceiling, for a leaf application no other
#   package links. There is no packages/firefox recipe any more, so the name
#   can never appear in Utah's repositories.
#
#   What ships instead is the Flatpak, which was already here before the RPM
#   went away: org.mozilla.firefox is in contracts/bluefin-desktop.toml, and
#   system_files/.../99-flatpaks.sh installs Bluefin's own policy into the
#   org.mozilla.firefox.systemconfig extension. So the browser is present and
#   configured; verify-desktop-contract.py asserts it on every build, which is
#   a stronger check than the RPM name ever got.
#
#   This entry exists so the parity arithmetic stays honest: Bluefin's manifest
#   asks for an RPM Utah does not install, and that is recorded here rather
#   than passing silently.
packages = [
    "evolution-ews-core",
    "firefox",
    "firefox-langpacks",
    "fish",
    "tailscale",
    "zsh",
]

# nvidia-container-toolkit was recorded here as a second gap. It is not one, and
# the reasoning that put it here was faulty: it came from UBlue's akmods bundle,
# that bundle is unusable on this base, and the conclusion drawn was that no
# source existed. The bundle was one source, not the only one.
#
# NVIDIA publishes the toolkit itself at
# https://nvidia.github.io/libnvidia-container/stable/rpm/$basearch -- a path
# with no distribution version in it, so unlike the akmods bundle it is not tied
# to a Fedora release or an exact kernel NEVR. Its dependencies are base OS
# libraries Hummingbird already has: glibc 2.17 symbols, libcap, libelf,
# libseccomp.so.2, libresolv, none of them version-pinned.
#
# So it is installed on the nvidia flavors from packages/nvidia-container.repo,
# and verify-rpm-contract.py asserts it by name. Container GPU access is not
# lost. The driver and its userspace still arrive as files from the .run payload
# rather than as RPMs, which is why only this one name is asserted.
#
# On CUDA, which was considered and deliberately not included.
#
# NVIDIA publishes a CUDA repository with a fedora44 directory, so it is
# available. Measured from its metadata rather than guessed: the cuda-toolkit
# closure is 65 packages, 3.97 GB to download and 7.68 GB installed. This image
# is a few GB, so that multiplies it, in every pull and every layer, and it has
# to survive an OCI export and a rechunk on a runner that already needed disk
# freed for the kernel build.
#
# The full `cuda` metapackage is worse and is not even installable here: it
# requires kmod-nvidia-open-dkms, nvidia-driver-libs, nvidia-driver-common and
# dkms, which are RPM names this image does not have, because the driver arrives
# from the .run payload as files.
#
# The right home for CUDA on an image like this is a container, which is exactly
# what the toolkit above makes possible: `podman run --device nvidia.com/gpu=all`
# against one of NVIDIA CUDA images gets the full toolkit with GPU access and
# nothing in the base image. That is a better answer than 7.68 GB of it baked in,
# so this stays out unless someone asks for it with that trade-off in view.
