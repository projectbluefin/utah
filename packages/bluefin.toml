# Machine-readable contract derived from Bluefin's effective package payload.
#
# Sources in projectbluefin/bluefin:
#   - build_files/packages/base.toml (fedora, version-specific, overrides, excluded)
#   - build_files/base/03-packages.sh (external and multimedia transactions)
#
# Sections:
#   [fedora]                 base Fedora packages common to all supported versions
#   [fedora_v*]              version-specific Fedora additions
#   [external]               packages from external repositories/COPRs
#   [multimedia]             codecs and multimedia packages from 03-packages.sh
#   [multimedia_overrides]   packages synced from negativo17/fedora-multimedia
#   [excluded]               packages removed from the base image
#
# Validated by scripts/check-parity.py on every CI run (`just check-parity`).

# Base packages from Fedora repos — common to all supported Fedora versions.
[fedora]
packages = [
    "adw-gtk3-theme",
    "adwaita-fonts-all",
    "alsa-firmware",
    "alsa-tools-firmware",
    "anaconda-live",
    "bootc",
    "bootupd",
    "containerd",
    "ddcutil",
    "distrobox",
    "dracut-live",
    "evtest",
    "fastfetch",
    "firefox",
    "firewall-config",
    "fish",
    "flatpak-spawn",
    "fzf",
    "gcc",
    "gcc-c++",
    "git-credential-libsecret",
    "gnome-ponytail-daemon",
    "gnome-tweaks",
    "google-noto-sans-cjk-vf-fonts",
    "grub2-efi-x64-cdboot",
    "gum",
    "gvfs-nfs",
    "ibus-mozc",
    "ibus-unikey",
    "igt-gpu-tools",
    "input-remapper",
    "isomd5sum",
    "just",
    "libappindicator-gtk3",
    "libayatana-appindicator-gtk3",
    "libblockdev-btrfs",
    "libblockdev-dm",
    "libblockdev-lvm",
    "libblockdev-mpath",
    "libcamera-gstreamer",
    "libcamera-tools",
    "libratbag-ratbagd",
    "libva-utils",
    "libxcrypt-compat",
    "livesys-scripts",
    "make",
    "mesa-libGLU",
    "mozc",
    "nautilus-gsconnect",
    "openrgb-udev-rules",
    "openssh-askpass",
    "pipewire-libs-extra",
    "python3-gnome-ponytail-daemon",
    "slitherer",
    "squashfs-tools",
    "switcheroo-control",
    "waypipe",
    "wireguard-tools",
    "wl-clipboard",
    "xdg-terminal-exec",
    "xorriso",
    "zenity",
    "zsh",
]

# Fedora 42 additions
[fedora_v42]
packages = [
    "evolution-ews-core",
]

# Fedora 43 additions
[fedora_v43]
packages = [
    "evolution-ews-core",
    "gnupg2-scdaemon",
]

# Fedora 44 additions
[fedora_v44]
packages = [
    "gnupg2-scdaemon",
]

# External and COPR packages installed in Bluefin's package transaction.
[external]
packages = [
    "tailscale",
    "uupd",
]

# Codecs and extra multimedia packages installed in Bluefin's transaction.
[multimedia]
packages = [
    "@multimedia",
    "ffmpeg",
    "ffmpeg-libs",
    "ffmpegthumbnailer",
    "gstreamer1-plugins-bad-free",
    "gstreamer1-plugins-bad-free-libs",
    "gstreamer1-plugins-base",
    "gstreamer1-plugins-good",
    "lame",
    "lame-libs",
    "libavcodec",
    "libfdk-aac",
    "libjxl",
]

# Packages synced from negativo17/fedora-multimedia repo.
[multimedia_overrides]
packages = [
    "intel-gmmlib",
    "intel-mediasdk",
    "intel-vpl-gpu-rt",
    "libheif",
    "libva",
    "libva-intel-media-driver",
    "mesa-dri-drivers",
    "mesa-filesystem",
    "mesa-libEGL",
    "mesa-libGL",
    "mesa-libgbm",
    "mesa-vulkan-drivers",
]

# Packages removed from the base image — conflicts with or replaced by image content.
[excluded]
packages = [
    "default-fonts-cjk-sans",
    "fedora-bookmarks",
    "fedora-chromium-config",
    "fedora-chromium-config-gnome",
    "fedora-third-party",
    "firefox-langpacks",
    "gnome-extensions-app",
    "gnome-shell-extension-background-logo",
    "gnome-software",
    "gnome-software-rpm-ostree",
    "gnome-terminal-nautilus",
    "google-noto-sans-cjk-fonts",
    "podman-docker",
    "totem-video-thumbnailer",
    "yelp",
]
