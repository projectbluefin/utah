# Runtime contract for Utah's Bluefin-derived desktop experience on top of
# Hummingbird. This is intentionally separate from packages/bluefin.toml:
# package parity proves RPMs; this file proves Utah identity, Bluefin desktop
# defaults, and first-boot Flatpak policy.

[branding]
files = [
  "/usr/share/ublue-os/bluefin-logos/bluefin.png",
  "/usr/share/pixmaps/bluefin-gdm-logo.png",
  # Control Center has compile-time logo paths, independent of os-release.
  "/usr/share/pixmaps/fedora_logo_med.png",
  "/usr/share/pixmaps/fedora_whitelogo_med.png",
  "/usr/share/pixmaps/fedora-logo.png",
  "/usr/share/pixmaps/system-logo-white.png",
  "/usr/share/icons/hicolor/scalable/actions/ublue-logo-symbolic.svg",
  "/usr/share/icons/hicolor/icon-theme.cache",
  # The os-release LOGO icon; common ships Bluefin's raptor under this name.
  "/usr/share/pixmaps/fedora-logo-icon.png",
  "/usr/share/ublue-os/bluefin-logos/chicken.png",
  "/usr/share/ublue-os/bluefin-logos/symbols/bluefin",
  "/usr/share/backgrounds/bluefin/01-bluefin.xml",
  "/usr/share/backgrounds/bluefin/06-bluefin.xml",
  "/usr/share/glib-2.0/schemas/zz0-bluefin-modifications.gschema.override",
  "/usr/share/ublue-os/fastfetch-user-count",
  "/usr/share/ublue-os/bazaar-install-count",
  "/usr/bin/chairlift-helper",
  "/usr/share/polkit-1/actions/io.projectbluefin.chairlift.ublue.policy",
]

[branding.os_release]
NAME = "Bluefin"
ID = "hummingbird"
ID_LIKE = "fedora"
HOME_URL = "https://projectbluefin.io"
DOCUMENTATION_URL = "https://docs.projectbluefin.io"
SUPPORT_URL = "https://github.com/projectbluefin/utah/issues/"
BUG_REPORT_URL = "https://github.com/projectbluefin/utah/issues/"
DEFAULT_HOSTNAME = "bluefin"
VERSION_CODENAME = "Utahraptor"
IMAGE_ID = "utah"
LOGO = "fedora-logo-icon"

[branding.os_release_patterns]
PRETTY_NAME = '^Bluefin \(Version: .+\)$'
VERSION = '^.+ \(Hummingbird\)$'
VARIANT_ID = '^utah(-.*)?$'
# ID, VERSION_ID and CPE_NAME are left at the Hummingbird base values so CVE
# scanners still recognise the image as Hummingbird-based; this pattern asserts
# the base CPE identity survives rather than pinning a per-release CPE string.
CPE_NAME = '^cpe:/a:redhat:hummingbird:\d+$'
OSTREE_VERSION = '^.+$'
IMAGE_VERSION = '^.+$'
BUILD_ID = '^.+$'

[branding.image_info]
image-name = "utah"
image-vendor = "projectbluefin"
base-image-name = "hummingbird"

[branding.image_info_patterns]
image-flavor = '^(main|nvidia|gaming|nvidia-gaming)$'
image-ref = '^ostree-image-signed:docker://ghcr\.io/projectbluefin/utah(-nvidia|-gaming|-nvidia-gaming)?$'
image-tag = '^.+$'
fedora-version = '^\d+$'

[configuration]
files = [
  # Common owns ChairLift's GUI preinstall and system integration (as on Dakota).
  "/usr/share/applications/io.projectbluefin.chairlift.desktop",
  "/usr/share/icons/hicolor/scalable/apps/io.projectbluefin.chairlift.svg",
  "/usr/share/icons/hicolor/symbolic/apps/io.projectbluefin.chairlift-symbolic.svg",
  "/usr/share/chairlift/config.yml",
  "/usr/share/ublue-os/homebrew/preinstall.d/chairlift.Brewfile",
  "/usr/bin/brew-preinstall",
  "/usr/libexec/brew-preinstall",
  "/usr/lib/systemd/user/brew-preinstall.service",
  "/usr/libexec/bootc-update-stage",
  "/usr/share/polkit-1/actions/io.projectbluefin.chairlift.bootc.policy",
  "/usr/share/glib-2.0/schemas/io.projectbluefin.chairlift.livery.gschema.xml",
  "/usr/share/glib-2.0/schemas/io.projectbluefin.chairlift.updates.gschema.xml",
  "/usr/share/glib-2.0/schemas/io.projectbluefin.chairlift.firstrun.gschema.xml",
  # dconf reads distro keyfiles only when the user profile names
  # system-db:distro. The factory dconf RPM ships that profile (with local
  # and site layers); Utah asserts it but must not overlay its own copy.
  "/etc/dconf/profile/user",
  "/etc/dconf/db/distro.d/01-bluefin-folders",
  "/etc/dconf/db/distro.d/02-bluefin-keybindings",
  "/etc/dconf/db/distro.d/03-bluefin-ptyxis-palette",
  "/etc/dconf/db/distro.d/04-bluefin-custom-command-menu",
  "/etc/dconf/db/distro.d/08-dakota-extension-defaults",
  "/etc/dconf/db/distro.d/locks/01-bluefin-locked-settings",
  # GDM greeter logo. GDM uses its own "gdm" dconf profile (provided by the
  # gdm RPM at /etc/dconf/profile/gdm); without this keyfile gnome-shell
  # falls back to /usr/share/pixmaps/fedora-gdm-logo.png from fedora-logos,
  # and the login screen shows the Fedora wordmark instead of Bluefin (#378).
  "/etc/dconf/db/gdm.d/01-bluefin-gdm-logo",
  "/usr/share/glib-2.0/schemas/zz3-bluefin-unsupported-stuff.gschema.override",
  # systemd-remount-fs.service.d/10-utah-composefs-skip.conf. On the composefs
  # image / is mounted read-only and the upstream unit unconditionally tries
  # to remount it read-write, fails with "overlay: No changes allowed in
  # reconfigure", and degrades the boot. The drop-in adds ConditionPathIsReadWrite=/
  # so the unit is skipped, not failed. #585.
  "/usr/lib/systemd/system/systemd-remount-fs.service.d/10-utah-composefs-skip.conf",
  # projectbluefin-countme.service.d/10-utah-burst-tolerance.conf. The daily
  # ping exits 0 per start, but harness-driven bursts (test unmask/reload
  # loops) trip systemd's default start limit and leave a failed unit that
  # fails the health check. The drop-in widens the burst window; #741.
  "/usr/lib/systemd/system/projectbluefin-countme.service.d/10-utah-burst-tolerance.conf",
  # Dakota desktop parity (#675): first-boot install-date stamping and the
  # booted-image snapshot for fastfetch. Wallpaper rotation stays with
  # Common's per-user timer (see configure-services.sh), so the Dakota month
  # symlink units are intentionally not shipped.
  "/usr/lib/systemd/system/ublue-firstboot-date.service",
  "/usr/lib/systemd/system/ublue-booted-image.service",
  "/usr/bin/ublue-booted-image-sync",
  # Common files configure-services.sh patches for Dakota parity. file_contains
  # skips missing files, so list them here to fail the build if Common drops one.
  "/usr/share/ublue-os/fastfetch.jsonc",
  "/usr/bin/ublue-image-info.sh",
  "/etc/profile.d/uwelcome.sh",
  # Common's Red Hat signature policy uses the unsuffixed key path. The pinned
  # Hummingbird base carries that key; Utah also stages its repository copy.
  "/etc/containers/policy.json",
  "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release",
  "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release-2",
]

[configuration.file_contains]
"/usr/share/applications/io.projectbluefin.chairlift.desktop" = [
  "Name=Control Center",
  "Exec=/home/linuxbrew/.linuxbrew/bin/chairlift-wrapper",
  "Icon=io.projectbluefin.chairlift",
]
"/usr/share/ublue-os/homebrew/preinstall.d/chairlift.Brewfile" = [
  'tap "projectbluefin/tap", trusted: true',
  'cask "projectbluefin/tap/chairlift"',
]
"/usr/share/polkit-1/actions/io.projectbluefin.chairlift.bootc.policy" = [
  '<annotate key="org.freedesktop.policykit.exec.path">/usr/libexec/bootc-update-stage</annotate>',
]
"/usr/share/glib-2.0/schemas/zz0-bluefin-modifications.gschema.override" = [
  "io.github.kolunmi.Bazaar.desktop",
  "picture-uri='file:///usr/share/backgrounds/bluefin/",
]
# Dakota parity (#675): fastfetch reads the first-boot install date stamped
# by ublue-firstboot-date.service instead of inferring age from /var/log.
"/usr/share/ublue-os/fastfetch.jsonc" = [
  "/var/lib/ublue-os/install-date",
  # The community stats come from bluefin-stats-refresh.service's cache (#860).
  "cat /var/cache/bluefin-stats/fastfetch-user-count 2>/dev/null || cat /usr/share/ublue-os/fastfetch-user-count",
  "cat /var/cache/bluefin-stats/bazaar-install-count 2>/dev/null || cat /usr/share/ublue-os/bazaar-install-count",
]
# Dakota parity (#675): ublue-image-info.sh prefers the boot-time snapshot
# ublue-booted-image.service writes, since unprivileged bootc status fails on
# bootc >= 1.14.
"/usr/bin/ublue-image-info.sh" = [
  "/run/ublue-os/booted-image",
]
# Dakota parity (#675): GDM's non-interactive login shell sources
# /etc/profile too, so uwelcome must only greet interactive shells.
"/etc/profile.d/uwelcome.sh" = [
  "case $- in",
]
"/etc/dconf/profile/user" = [
  "user-db:user",
  "system-db:distro",
]
"/etc/containers/policy.json" = [
  "\"keyPath\": \"/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\"",
]
"/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release" = [
  "Key fingerprint = 567E 347A D004 4ADE 55BA  8A5F 199E 2F91 FD43 1D51",
]
"/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release-2" = [
  "Key fingerprint = 567E 347A D004 4ADE 55BA  8A5F 199E 2F91 FD43 1D51",
]
"/etc/dconf/db/distro.d/04-bluefin-custom-command-menu" = [
  "Bazaar App Store",
  "docs.projectbluefin.io",
  "menuicon-setting='ublue-logo-symbolic'",
]
"/etc/dconf/db/distro.d/08-dakota-extension-defaults" = [
  "show-indicator=false",
  "layouts-json=",
]
"/usr/share/glib-2.0/schemas/zz3-bluefin-unsupported-stuff.gschema.override" = [
  "disable-extension-version-validation=true",
  "tilingshell@ferrarodomenico.com",
]
"/etc/dconf/db/distro.d/02-bluefin-keybindings" = [
  "xdg-terminal-exec",
]
# The login screen logo must point at the Bluefin mark. Asserting both the
# schema and the asset path guards against reverting to the Fedora fallback
# or to the full-size bluefin.png, which renders far too large. The path must
# be the small wordmark that [branding].files asserts is shipped. See #378.
"/etc/dconf/db/gdm.d/01-bluefin-gdm-logo" = [
  "[org/gnome/login-screen]",
  "logo='/usr/share/pixmaps/bluefin-gdm-logo.png'",
]
# Composefs mounts / read-only, so systemd-remount-fs.service must be
# conditional on / being writable; otherwise it fails on every boot and
# degrades the system. The drop-in ships the condition -- assert the line so
# a refactor that drops it fails the build rather than the boot (#585).
"/usr/lib/systemd/system/systemd-remount-fs.service.d/10-utah-composefs-skip.conf" = [
  "ConditionPathIsReadWrite=/",
]

[flatpak]
files = [
  "/etc/flatpak/remotes.d/flathub.flatpakrepo",
  "/usr/share/flatpak/preinstall.d/bazaar.preinstall",
  "/usr/share/flatpak/preinstall.d/ghostty.preinstall",
  "/etc/flatpak/remotes.d/tuna-os.flatpakrepo",
  "/usr/share/ublue-os/privileged-setup.hooks.d/99-flatpaks.sh",
  "/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile",
  # Common's `system_files/bluefin/` profile supplies the Firefox preference
  # file the `99-flatpaks.sh` hook copies at first boot; assert the actual
  # payload rather than the COPY line so a missing Common payload fails
  # image verification. See issue #488.
  "/usr/share/ublue-os/firefox-config/01-bluefin-global.js",
]
brewfile = "/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile"
remote = "/etc/flatpak/remotes.d/flathub.flatpakrepo"
remote_url = "https://dl.flathub.org/repo/"
apps = [
  "be.alexandervanhee.gradia",
  "com.github.PintaProject.Pinta",
  "com.github.tchx84.Flatseal",
  "com.mattjakeman.ExtensionManager",
  "com.ranfdev.DistroShelf",
  "io.github.flattool.Ignition",
  "io.github.kolunmi.Bazaar",
  "io.gitlab.adhami3310.Impression",
  "io.missioncenter.MissionCenter",
  "org.gnome.Calculator",
  "org.gnome.Calendar",
  "org.gnome.Characters",
  "org.gnome.Connections",
  "org.gnome.Contacts",
  "org.gnome.DejaDup",
  "org.gnome.FileRoller",
  "org.gnome.Firmware",
  "org.gnome.Logs",
  "org.gnome.Loupe",
  "org.gnome.Maps",
  "org.gnome.NautilusPreviewer",
  "org.gnome.Papers",
  "org.gnome.Showtime",
  "org.gnome.SimpleScan",
  "org.gnome.Snapshot",
  "org.gnome.Decibels",
  "org.gnome.TextEditor",
  "org.gnome.Weather",
  "org.gnome.baobab",
  "org.gnome.clocks",
  "org.gnome.font-viewer",
  "org.gtk.Gtk3theme.adw-gtk3",
  "org.gtk.Gtk3theme.adw-gtk3-dark",
  # Spelled lower-case because Bluefin's Brewfile spells it that way. Flathub's
  # application id is org.mozilla.Thunderbird, so this looks like a typo
  # upstream -- but this list is a parity assertion against their Brewfile, not
  # against Flathub, and correcting it here would report drift that is not
  # ours. Follow it back if Thunderbird turns out not to install.
  #
  # The comparison is order-sensitive, so this list is in Brewfile order, not
  # sorted: thunderbird precedes firefox there.
  "org.mozilla.thunderbird",
  "org.mozilla.firefox",
  "page.tesk.Refine",
]

[services]
enabled = [
  "avahi-daemon.service",
  "avahi-daemon.socket",
  "bluetooth.service",
  # Dakota desktop parity (#675).
  "ublue-firstboot-date.service",
  "ublue-booted-image.service",
  "bootc-unified-storage.service",
  "brew-setup.service",
  "cups.socket",
  "bluefin-stats-refresh.timer",
  "dconf-update.service",
  "flatpak-nuke-fedora.service",
  "flatpak-preinstall.service",
  "gdm.service",
  "input-remapper.service",
  "ModemManager.service",
  "thermald.service",
  "intel_lpmd.service",
  "sysstat.service",
  "sysstat-collect.timer",
  "sysstat-summary.timer",
  "projectbluefin-countme.timer",
  "switcheroo-control.service",
  "ublue-system-setup.service",
  "uupd.timer",
  "systemd-boot-update.service",
]
# Per-user services, checked with `systemctl --global is-enabled`. Hummingbird's
# user preset disables everything but dbus; without these an installed Utah had
# no audio server. See user-preset/85-utah-desktop.preset.
user_enabled = [
  "brew-preinstall.service",
  "ublue-user-setup.service",
  "pipewire.socket",
  "pipewire-pulse.socket",
  "wireplumber.service",
  "xdg-user-dirs.service",
]
masked = [
  "bootc-fetch-apply-updates.service",
  "bootc-fetch-apply-updates.timer",
  # Hummingbird's server kargs.d declares console=ttyS0, so the getty generator
  # spawns an agetty on a port desktop hardware does not have. It dies on EIO
  # and respawns every ~10s for the whole session; see #103.
  "serial-getty@ttyS0.service",
]
