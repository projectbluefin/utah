# Runtime contract for Utah's Bluefin-derived desktop experience on top of
# Hummingbird. This is intentionally separate from packages/bluefin.toml:
# package parity proves RPMs; this file proves Utah identity, Bluefin desktop
# defaults, and first-boot Flatpak policy.

[branding]
files = [
  "/usr/share/ublue-os/bluefin-logos/bluefin.png",
  "/usr/share/pixmaps/bluefin-gdm-logo.png",
  # Control Center has compile-time logo paths, independent of os-release.
  "/usr/share/pixmaps/fedora_logo_med.png",
  "/usr/share/pixmaps/fedora_whitelogo_med.png",
  "/usr/share/pixmaps/fedora-logo.png",
  "/usr/share/pixmaps/system-logo-white.png",
  "/usr/share/icons/hicolor/scalable/actions/ublue-logo-symbolic.svg",
  "/usr/share/icons/hicolor/icon-theme.cache",
  "/usr/share/ublue-os/bluefin-logos/chicken.png",
  "/usr/share/ublue-os/bluefin-logos/symbols/bluefin",
  "/usr/share/backgrounds/bluefin/01-bluefin.xml",
  "/usr/share/backgrounds/bluefin/06-bluefin.xml",
  "/usr/share/glib-2.0/schemas/zz0-bluefin-modifications.gschema.override",
  "/usr/share/ublue-os/fastfetch-user-count",
  "/usr/share/ublue-os/bazaar-install-count",
]

[branding.os_release]
NAME = "Utah"
ID = "hummingbird"
ID_LIKE = "fedora"
HOME_URL = "https://projectbluefin.io"
DOCUMENTATION_URL = "https://docs.projectbluefin.io"
SUPPORT_URL = "https://github.com/projectbluefin/utah/issues/"
BUG_REPORT_URL = "https://github.com/projectbluefin/utah/issues/"
DEFAULT_HOSTNAME = "utah"
VERSION_CODENAME = "Utahraptor"
IMAGE_ID = "utah"

[branding.os_release_patterns]
PRETTY_NAME = '^Utah \(Version: .+\)$'
VERSION = '^.+ \(Hummingbird\)$'
VARIANT_ID = '^utah(-.*)?$'
# ID, VERSION_ID and CPE_NAME are left at the Hummingbird base values so CVE
# scanners still recognise the image as Hummingbird-based; this pattern asserts
# the base CPE identity survives rather than pinning a per-release CPE string.
CPE_NAME = '^cpe:/a:redhat:hummingbird:\d+$'
OSTREE_VERSION = '^.+$'
IMAGE_VERSION = '^.+$'
BUILD_ID = '^.+$'

[branding.image_info]
image-name = "utah"
image-vendor = "projectbluefin"
base-image-name = "hummingbird"

[branding.image_info_patterns]
image-flavor = '^(main|nvidia|gaming|nvidia-gaming)$'
image-ref = '^ostree-image-signed:docker://ghcr\.io/projectbluefin/utah(-nvidia|-gaming|-nvidia-gaming)?$'
image-tag = '^.+$'
fedora-version = '^\d+$'

[configuration]
files = [
  "/etc/dconf/db/distro.d/01-bluefin-folders",
  "/etc/dconf/db/distro.d/02-bluefin-keybindings",
  "/etc/dconf/db/distro.d/03-bluefin-ptyxis-palette",
  "/etc/dconf/db/distro.d/04-bluefin-custom-command-menu",
  "/etc/dconf/db/distro.d/locks/01-bluefin-locked-settings",
  # GDM greeter logo. GDM uses its own "gdm" dconf profile (provided by the
  # gdm RPM at /etc/dconf/profile/gdm); without this keyfile gnome-shell
  # falls back to /usr/share/pixmaps/fedora-gdm-logo.png from fedora-logos,
  # and the login screen shows the Fedora wordmark instead of Bluefin (#378).
  "/etc/dconf/db/gdm.d/01-bluefin-gdm-logo",
]

[configuration.file_contains]
"/usr/share/glib-2.0/schemas/zz0-bluefin-modifications.gschema.override" = [
  "io.github.kolunmi.Bazaar.desktop",
  "picture-uri='file:///usr/share/backgrounds/bluefin/",
]
"/etc/dconf/db/distro.d/04-bluefin-custom-command-menu" = [
  "Bazaar App Store",
  "docs.projectbluefin.io",
  "menuicon-setting='ublue-logo-symbolic'",
]
"/etc/dconf/db/distro.d/02-bluefin-keybindings" = [
  "xdg-terminal-exec",
]
# The login screen logo must point at the Bluefin mark. Asserting both the
# schema and the asset path guards against reverting to the Fedora fallback
# or to the full-size bluefin.png, which renders far too large. The path must
# be the small wordmark that [branding].files asserts is shipped. See #378.
"/etc/dconf/db/gdm.d/01-bluefin-gdm-logo" = [
  "[org/gnome/login-screen]",
  "logo='/usr/share/pixmaps/bluefin-gdm-logo.png'",
]

[flatpak]
files = [
  "/etc/flatpak/remotes.d/flathub.flatpakrepo",
  "/usr/share/flatpak/preinstall.d/bazaar.preinstall",
  "/usr/share/ublue-os/privileged-setup.hooks.d/99-flatpaks.sh",
  "/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile",
]
brewfile = "/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile"
remote = "/etc/flatpak/remotes.d/flathub.flatpakrepo"
remote_url = "https://dl.flathub.org/repo/"
apps = [
  "be.alexandervanhee.gradia",
  "com.github.PintaProject.Pinta",
  "com.github.tchx84.Flatseal",
  "com.mattjakeman.ExtensionManager",
  "com.ranfdev.DistroShelf",
  "io.github.flattool.Ignition",
  "io.github.flattool.Warehouse",
  "io.github.kolunmi.Bazaar",
  "io.gitlab.adhami3310.Impression",
  "io.missioncenter.MissionCenter",
  "it.mijorus.smile",
  "org.gnome.Calculator",
  "org.gnome.Calendar",
  "org.gnome.Characters",
  "org.gnome.Connections",
  "org.gnome.Contacts",
  "org.gnome.DejaDup",
  "org.gnome.FileRoller",
  "org.gnome.Firmware",
  "org.gnome.Logs",
  "org.gnome.Loupe",
  "org.gnome.Maps",
  "org.gnome.NautilusPreviewer",
  "org.gnome.Papers",
  "org.gnome.Showtime",
  "org.gnome.SimpleScan",
  "org.gnome.Snapshot",
  "org.gnome.Decibels",
  "org.gnome.TextEditor",
  "org.gnome.Weather",
  "org.gnome.baobab",
  "org.gnome.clocks",
  "org.gnome.font-viewer",
  "org.gtk.Gtk3theme.adw-gtk3",
  "org.gtk.Gtk3theme.adw-gtk3-dark",
  # Spelled lower-case because Bluefin's Brewfile spells it that way. Flathub's
  # application id is org.mozilla.Thunderbird, so this looks like a typo
  # upstream -- but this list is a parity assertion against their Brewfile, not
  # against Flathub, and correcting it here would report drift that is not
  # ours. Follow it back if Thunderbird turns out not to install.
  #
  # The comparison is order-sensitive, so this list is in Brewfile order, not
  # sorted: thunderbird precedes firefox there.
  "org.mozilla.thunderbird",
  "org.mozilla.firefox",
  "page.tesk.Refine",
]

[services]
enabled = [
  "bluetooth.service",
  "bootc-unified-storage.service",
  "brew-setup.service",
  "cups.socket",
  "dconf-update.service",
  "flatpak-nuke-fedora.service",
  "flatpak-preinstall.service",
  "gdm.service",
  "input-remapper.service",
  "ModemManager.service",
  "ublue-system-setup.service",
  "uupd.timer",
  "systemd-boot-update.service",
]
# Per-user services, checked with `systemctl --global is-enabled`. Hummingbird's
# user preset disables everything but dbus; without these an installed Utah had
# no audio server. See user-preset/85-utah-desktop.preset.
user_enabled = [
  "pipewire.socket",
  "pipewire-pulse.socket",
  "wireplumber.service",
  "xdg-user-dirs.service",
]
masked = [
  "bootc-fetch-apply-updates.service",
  "bootc-fetch-apply-updates.timer",
  # Hummingbird's server kargs.d declares console=ttyS0, so the getty generator
  # spawns an agetty on a port desktop hardware does not have. It dies on EIO
  # and respawns every ~10s for the whole session; see #103.
  "serial-getty@ttyS0.service",
]
