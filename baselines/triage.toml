# Triage of every Bluefin package Utah lacks (scripts/image-baseline.py).
#
# One table per package. status is one of:
#   planned      Utah should ship it; issue tracks the work
#   waived       Utah deliberately differs from Bluefin; reason says why
#   unavailable  listed in packages/utah.toml [unavailable]
#   untriaged    not decided yet (mostly libraries and tools that arrive as
#                dependencies of something else)
# `just check` fails on any gap missing from this file, so a new gap needs a
# decision before it can land. Drop an entry once it stops being a gap.

