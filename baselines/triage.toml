# Triage of every Dakota item Utah lacks (scripts/image-baseline.py).
#
# An item is the Dakota element guessed to install a user-visible file
# (baselines/dakota/surface.tsv), or the file's path when no element name
# matched. status is one of:
#   planned      Utah should ship it; issue tracks the work (#1236 is the
#                Dakota parity epic, its children track the structural moves)
#   waived       Utah deliberately differs from Dakota; reason says why
#   unavailable  listed in packages/utah.toml [unavailable]
#   untriaged    not decided yet (mostly libraries, SDK and developer tools
#                that arrive as dependencies of something else); area groups them
# `just check` fails on any gap missing from this file, so a new gap needs a
# decision before it can land. Drop an entry once it stops being a gap.

[item]

# --- Structural differences, one epic child each ---------------------------

